            [&#x27;can_interact&#x27;,&#x27;skip_chat&#x27;,&#x27;FALSE&#x27;,&#x27;false&#x27;],
            [&#x27;decide_chat&#x27;,&#x27;should_chat&#x27;],
            [&#x27;skip_chat&#x27;,&#x27;should_chat&#x27;],

        reflection: {

          height: 1260,

            { id: &#x27;read_recent_memory&#x27;, type: &#x27;readstate&#x27;, title: &#x27;读取近期记忆&#x27;, x: 36, y: 150, inputs: [[&#x27;agent_context&#x27;,&#x27;AgentContext&#x27;]], outputs: [[&#x27;recent_memories&#x27;,&#x27;Memory[]&#x27;]], statePath: &#x27;agent.memory.recent&#x27; },
            { id: &#x27;needs_reflection&#x27;, type: &#x27;ifelse&#x27;, title: &#x27;达到认知阈值&#x27;, x: 36, y: 320, inputs: [[&#x27;recent_memories&#x27;,&#x27;Memory[]&#x27;]], outputs: [[&#x27;needs_reflection&#x27;,&#x27;boolean&#x27;]], condition: &#x27;sum(item.importance for item in recent_memories) &gt;= context.reflect_threshold&#x27; },
            { id: &#x27;find_focus&#x27;, type: &#x27;llm&#x27;, title: &#x27;提炼反思焦点&#x27;, x: 5, y: 500, inputs: [[&#x27;recent_memories&#x27;,&#x27;Memory[]&#x27;]], outputs: [[&#x27;focus_questions&#x27;,&#x27;Question[]&#x27;]], prompt: &#x27;从近期高重要度记忆中提炼最值得反思的三个问题。&#x27;, model: &#x27;实验默认 Chat 模型&#x27; },
            { id: &#x27;generate_insights&#x27;, type: &#x27;loop&#x27;, title: &#x27;逐项生成洞察&#x27;, x: 5, y: 690, inputs: [[&#x27;focus_questions&#x27;,&#x27;Question[]&#x27;]], outputs: [[&#x27;insights&#x27;,&#x27;Insight[]&#x27;]], condition: &#x27;for question in focus_questions&#x27; },
            { id: &#x27;save_insights&#x27;, type: &#x27;writestate&#x27;, title: &#x27;写入认知记忆&#x27;, x: 36, y: 880, inputs: [[&#x27;insights&#x27;,&#x27;Insight[]?&#x27;]], outputs: [[&#x27;reflection_delta&#x27;,&#x27;MemoryDelta&#x27;]], statePath: &#x27;agent.memory.reflections&#x27; },
            { id: &#x27;reflection_end&#x27;, type: &#x27;end&#x27;, title: &#x27;返回反思结果&#x27;, x: 36, y: 1080, inputs: [[&#x27;reflection_delta&#x27;,&#x27;MemoryDelta&#x27;]], outputs: [[&#x27;reflection_result&#x27;,&#x27;ReflectionResult&#x27;]] }
          ],
          edges: [
            [&#x27;reflection_start&#x27;,&#x27;read_recent_memory&#x27;],
            [&#x27;read_recent_memory&#x27;,&#x27;needs_reflection&#x27;],
            [&#x27;needs_reflection&#x27;,&#x27;find_focus&#x27;,&#x27;TRUE&#x27;,&#x27;true&#x27;],
            [&#x27;find_focus&#x27;,&#x27;generate_insights&#x27;],
            [&#x27;generate_insights&#x27;,&#x27;save_insights&#x27;],
            [&#x27;needs_reflection&#x27;,&#x27;save_insights&#x27;,&#x27;FALSE&#x27;,&#x27;false&#x27;],
            [&#x27;save_insights&#x27;,&#x27;reflection_end&#x27;]
          ]
        }
      };

      let currentFlowKey = &#x27;schedule&#x27;;
      let selectedId = &#x27;schedule_decompose&#x27;;
      let panel = &#x27;contract&#x27;;
      let addedCount = 0;
      let nativeDrag = null;

      Object.values(flowStore).forEach(flow =&gt; {
        const baselineNodes = cloneData(flow.nodes);
        const baselineEdges = cloneData(flow.edges);
        flow.versions = [
          { id: &#x27;draft&#x27;, name: &#x27;当前草稿&#x27;, meta: &#x27;刚刚编辑 · 尚未保存&#x27;, current: true },
          { id: &#x27;v3&#x27;, name: &#x27;版本 3&#x27;, meta: &#x27;昨天 18:42 · 优化节点契约&#x27;, nodes: cloneData(baselineNodes), edges: cloneData(baselineEdges) },
          { id: &#x27;v2&#x27;, name: &#x27;版本 2&#x27;, meta: &#x27;8 月 8 日 14:20 · 调整条件分支&#x27;, nodes: cloneData(baselineNodes), edges: cloneData(baselineEdges) },
          { id: &#x27;v1&#x27;, name: &#x27;版本 1&#x27;, meta: &#x27;系统内置 · 初始流程定义&#x27;, isDefault: true, nodes: cloneData(baselineNodes), edges: cloneData(baselineEdges) }
        ];
      });

      function esc(value) {
        return String(value ?? &#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;]/g, char =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;}[char]));
      }

      function setVersionPopover(open) {
        const popover = root.querySelector(&#x27;#gfcVersionPopover&#x27;);
        popover.hidden = !open;
        root.querySelector(&#x27;#gfcVersionHistory&#x27;).setAttribute(&#x27;aria-expanded&#x27;, String(open));
        if (open) renderVersionHistory();
      }

      function renderVersionHistory() {
        const flow = flowStore[currentFlowKey];
        root.querySelector(&#x27;#gfcVersionTitle&#x27;).textContent = flow.title + &#x27; · 版本记录&#x27;;
        root.querySelector(&#x27;#gfcVersionList&#x27;).innerHTML = flow.versions.map(version =&gt; {
          const badge = version.isDefault ? &#x27;&lt;span class=&quot;gfc-default-badge&quot;&gt;默认流程&lt;/span&gt;&#x27; : &#x27;&#x27;;
          const action = version.current
            ? &#x27;&lt;span class=&quot;gfc-version&quot;&gt;当前&lt;/span&gt;&#x27;
            : &#x27;&lt;button class=&quot;gfc-restore-button&quot; type=&quot;button&quot; data-restore-version=&quot;&#x27; + esc(version.id) + &#x27;&quot;&gt;恢复到草稿&lt;/button&gt;&#x27;;
          return &#x27;&lt;div class=&quot;gfc-version-item&quot;&gt;&lt;div&gt;&lt;div class=&quot;gfc-version-name&quot;&gt;&#x27; + esc(version.name) + badge +
            &#x27;&lt;/div&gt;&lt;div class=&quot;gfc-version-meta&quot;&gt;&#x27; + esc(version.meta) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; + action + &#x27;&lt;/div&gt;&#x27;;
        }).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-restore-version]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; restoreVersion(button.dataset.restoreVersion)));
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function restoreVersion(versionId) {
        const flow = flowStore[currentFlowKey];
        const version = flow.versions.find(item =&gt; item.id === versionId);
        if (!version || !version.nodes) return;
        nodes.splice(0, nodes.length, ...cloneData(version.nodes));
        edges.splice(0, edges.length, ...cloneData(version.edges));
        flow.nodes = cloneData(nodes);
        flow.edges = cloneData(edges);
        selectedId = (nodes.find(node =&gt; node.type === &#x27;llm&#x27;) || nodes[0]).id;
        root.querySelector(&#x27;#gfcBoard&#x27;).style.minHeight = flow.height + &#x27;px&#x27;;
        root.querySelector(&#x27;#gfcSaveState&#x27;).textContent = &#x27;有未保存修改&#x27;;
        renderNodes();
        renderInspector();
        setVersionPopover(false);
        showToast(&#x27;已将&#x27; + version.name + (version.isDefault ? &#x27;（默认流程）&#x27; : &#x27;&#x27;) + &#x27;恢复到当前草稿&#x27;);
      }

      function switchFlow(nextKey) {
        if (!flowStore[nextKey] || nextKey === currentFlowKey) return;
        const current = flowStore[currentFlowKey];
        current.nodes = cloneData(nodes);
        current.edges = cloneData(edges);
        currentFlowKey = nextKey;
        const next = flowStore[nextKey];
        nodes.splice(0, nodes.length, ...cloneData(next.nodes));
        edges.splice(0, edges.length, ...cloneData(next.edges));
        selectedId = (nodes.find(node =&gt; node.type === &#x27;llm&#x27;) || nodes[0]).id;
        panel = &#x27;contract&#x27;;
        root.querySelector(&#x27;#gfcCanvasTitle&#x27;).textContent = next.title;
        root.querySelector(&#x27;#gfcCanvasVersion&#x27;).textContent = next.version;
        root.querySelector(&#x27;#gfcBoard&#x27;).style.minHeight = next.height + &#x27;px&#x27;;
        root.querySelectorAll(&#x27;.gfc-flow-tab&#x27;).forEach(tab =&gt; tab.setAttribute(&#x27;aria-selected&#x27;, String(tab.dataset.flow === nextKey)));
        root.querySelectorAll(&#x27;.gfc-inspector-tab&#x27;).forEach(tab =&gt; tab.setAttribute(&#x27;aria-selected&#x27;, String(tab.dataset.panel === panel)));
        setVersionPopover(false);
        renderNodes();
        renderInspector();
      }

      function nodeMarkup(node) {
        const meta = typeMeta[node.type];
        const inputs = node.inputs.slice(0, 1).map(item =&gt; `&lt;span class=&quot;gfc-port-row input&quot;&gt;&lt;span class=&quot;gfc-port-dot input&quot;&gt;&lt;/span&gt;&lt;span class=&quot;gfc-port-label&quot;&gt;输入&lt;/span&gt;&lt;code&gt;${esc(item[0])}&lt;/code&gt;&lt;span class=&quot;gfc-port-type&quot;&gt;${esc(item[1])}&lt;/span&gt;&lt;/span&gt;`).join(&#x27;&#x27;);
        const outputs = node.outputs.slice(0, 1).map(item =&gt; `&lt;span class=&quot;gfc-port-row output&quot;&gt;&lt;span class=&quot;gfc-port-label&quot;&gt;输出&lt;/span&gt;&lt;code&gt;${esc(item[0])}&lt;/code&gt;&lt;span class=&quot;gfc-port-type&quot;&gt;${esc(item[1])}&lt;/span&gt;&lt;span class=&quot;gfc-port-dot output&quot;&gt;&lt;/span&gt;&lt;/span&gt;`).join(&#x27;&#x27;);
        const moreInputs = node.inputs.length &gt; 1 ? `${node.inputs.length - 1} 个其他输入` : &#x27;&#x27;;
        const moreOutputs = node.outputs.length &gt; 1 ? `${node.outputs.length - 1} 个其他输出` : &#x27;&#x27;;
        const morePorts = moreInputs || moreOutputs ? `&lt;span class=&quot;gfc-more-ports&quot;&gt;${[moreInputs, moreOutputs].filter(Boolean).join(&#x27; · &#x27;)}&lt;/span&gt;` : &#x27;&#x27;;
        const branch = node.type === &#x27;ifelse&#x27; ? &#x27;&lt;span class=&quot;gfc-branch-ports&quot;&gt;&lt;span&gt;是 · TRUE&lt;/span&gt;&lt;span&gt;否 · FALSE&lt;/span&gt;&lt;/span&gt;&#x27; : &#x27;&#x27;;
        const rolePrefix = node.type === &#x27;script&#x27; ? &#x27;function&#x27; : node.type === &#x27;llm&#x27; ? &#x27;prompt&#x27; : node.type === &#x27;ifelse&#x27; ? &#x27;condition&#x27; : node.type === &#x27;subflow&#x27; ? &#x27;subflow&#x27; : &#x27;node&#x27;;
        const summary = node.summary ? `&lt;span&gt;${esc(node.summary)}&lt;/span&gt;` : `&lt;span&gt;${rolePrefix} · ${esc(node.id)}&lt;/span&gt;`;
        return `&lt;button class=&quot;gfc-node${node.id === selectedId ? &#x27; selected&#x27; : &#x27;&#x27;}${node.unconnected ? &#x27; unconnected&#x27; : &#x27;&#x27;}&quot; data-node-id=&quot;${esc(node.id)}&quot; data-type=&quot;${esc(node.type)}&quot; draggable=&quot;true&quot; style=&quot;left:${node.x}%;top:${node.y}px&quot;&gt;
          &lt;span class=&quot;gfc-node-head&quot;&gt;&lt;span class=&quot;gfc-node-type&quot;&gt;&lt;i data-lucide=&quot;${meta.icon}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;${meta.label}&lt;/span&gt;&lt;span class=&quot;gfc-node-menu&quot;&gt;•••&lt;/span&gt;&lt;/span&gt;
          &lt;span class=&quot;gfc-node-name&quot;&gt;&lt;strong&gt;${esc(node.title)}&lt;/strong&gt;${summary}&lt;/span&gt;
          &lt;span class=&quot;gfc-node-ports&quot;&gt;${inputs}${outputs}${morePorts}&lt;/span&gt;${branch}
        &lt;/button&gt;`;
      }

      function renderNodes() {
        root.querySelector(&#x27;#gfcNodeLayer&#x27;).innerHTML = nodes.map(nodeMarkup).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;.gfc-node&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
          if (button.dataset.dragged === &#x27;1&#x27;) return;
          selectedId = button.dataset.nodeId;
          renderNodes();
          renderInspector();
        }));
        root.querySelectorAll(&#x27;.gfc-node&#x27;).forEach(button =&gt; {
          const node = nodes.find(item =&gt; item.id === button.dataset.nodeId);
          if (node) enableNodeDrag(button, node);
        });
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        requestAnimationFrame(drawEdges);
      }

      function enableNodeDrag(button, node) {
        let drag = null;
        button.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
          if ((event.button !== 0 &amp;&amp; event.button !== -1) || window.matchMedia(&#x27;(max-width: 540px)&#x27;).matches) return;
          const board = root.querySelector(&#x27;#gfcBoard&#x27;);
          const boardRect = board.getBoundingClientRect();
          const nodeRect = button.getBoundingClientRect();
          drag = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            left: nodeRect.left - boardRect.left,
            top: nodeRect.top - boardRect.top,
            board,
            boardRect,
            moved: false
          };
          selectedId = node.id;
          root.querySelectorAll(&#x27;.gfc-node&#x27;).forEach(item =&gt; item.classList.toggle(&#x27;selected&#x27;, item === button));
          renderInspector();
          button.classList.add(&#x27;dragging&#x27;);
          button.setPointerCapture(event.pointerId);
        });
        button.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
          if (!drag || event.pointerId !== drag.pointerId) return;
          const dx = event.clientX - drag.startX;
          const dy = event.clientY - drag.startY;
          if (Math.abs(dx) + Math.abs(dy) &gt; 3) drag.moved = true;
          const maxLeft = Math.max(0, drag.boardRect.width - button.offsetWidth);
          const left = Math.max(0, Math.min(maxLeft, drag.left + dx));
          const top = Math.max(0, drag.top + dy);
          node.x = drag.boardRect.width ? (left / drag.boardRect.width) * 100 : 0;
          node.y = top;
          button.style.left = `${node.x}%`;
          button.style.top = `${node.y}px`;
          const requiredHeight = top + button.offsetHeight + 90;
          if (requiredHeight &gt; drag.board.clientHeight) drag.board.style.minHeight = `${requiredHeight}px`;
          drawEdges();
        });
        const finishDrag = event =&gt; {
          if (!drag || event.pointerId !== drag.pointerId) return;
          button.dataset.dragged = drag.moved ? &#x27;1&#x27; : &#x27;0&#x27;;
          button.classList.remove(&#x27;dragging&#x27;);
          if (button.hasPointerCapture(event.pointerId)) button.releasePointerCapture(event.pointerId);
          if (drag.moved) root.querySelector(&#x27;#gfcSaveState&#x27;).textContent = &#x27;有未保存修改&#x27;;
          drag = null;
          window.setTimeout(() =&gt; { button.dataset.dragged = &#x27;0&#x27;; }, 0);
        };
        button.addEventListener(&#x27;pointerup&#x27;, finishDrag);
        button.addEventListener(&#x27;pointercancel&#x27;, finishDrag);
        button.addEventListener(&#x27;dragstart&#x27;, event =&gt; {
          if (window.matchMedia(&#x27;(max-width: 540px)&#x27;).matches) {
            event.preventDefault();
            return;
          }
          const board = root.querySelector(&#x27;#gfcBoard&#x27;);
          const boardRect = board.getBoundingClientRect();
          const nodeRect = button.getBoundingClientRect();
          nativeDrag = {
            node,
            button,
            offsetX: event.clientX - nodeRect.left,
            offsetY: event.clientY - nodeRect.top,
            board,
            boardRect
          };
          selectedId = node.id;
          button.classList.add(&#x27;dragging&#x27;);
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = &#x27;move&#x27;;
            event.dataTransfer.setData(&#x27;text/plain&#x27;, node.id);
          }
        });
        button.addEventListener(&#x27;dragend&#x27;, () =&gt; {
          button.classList.remove(&#x27;dragging&#x27;);
          nativeDrag = null;
        });
      }

      function drawEdges() {
        const board = root.querySelector(&#x27;#gfcBoard&#x27;);
        const svg = root.querySelector(&#x27;#gfcWires&#x27;);
        const boardRect = board.getBoundingClientRect();
        if (!boardRect.width) return;
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${boardRect.width} ${boardRect.height}`);
        const markup = [`&lt;defs&gt;&lt;marker id=&quot;gfcArrow&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; refX=&quot;6&quot; refY=&quot;3.5&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L7,3.5 L0,7 Z&quot; fill=&quot;var(--gfc-line-strong)&quot;&gt;&lt;/path&gt;&lt;/marker&gt;&lt;/defs&gt;`];
        edges.forEach(([sourceId,targetId,label,kind]) =&gt; {
          const source = root.querySelector(`[data-node-id=&quot;${sourceId}&quot;]`);
          const target = root.querySelector(`[data-node-id=&quot;${targetId}&quot;]`);
          if (!source || !target) return;
          const s = source.getBoundingClientRect();
          const t = target.getBoundingClientRect();
          const sx = s.left - boardRect.left + s.width / 2;
          const sy = s.bottom - boardRect.top;
          const tx = t.left - boardRect.left + t.width / 2;
          const ty = t.top - boardRect.top;
          const midY = sy + Math.max(22, (ty - sy) / 2);
          const radius = 9;
          const direction = tx &gt;= sx ? 1 : -1;
          const d = Math.abs(tx - sx) &lt; 2
            ? `M ${sx} ${sy} L ${tx} ${ty}`
            : `M ${sx} ${sy} L ${sx} ${midY - radius} Q ${sx} ${midY} ${sx + direction * radius} ${midY} L ${tx - direction * radius} ${midY} Q ${tx} ${midY} ${tx} ${midY + radius} L ${tx} ${ty}`;
          markup.push(`&lt;path class=&quot;gfc-wire ${kind || &#x27;&#x27;}&quot; d=&quot;${d}&quot; marker-end=&quot;url(#gfcArrow)&quot;&gt;&lt;/path&gt;`);
          if (label) markup.push(`&lt;text class=&quot;gfc-wire-label&quot; x=&quot;${sx + (direction * 12)}&quot; y=&quot;${sy + 17}&quot; text-anchor=&quot;${direction &gt; 0 ? &#x27;start&#x27; : &#x27;end&#x27;}&quot;&gt;${label}&lt;/text&gt;`);
        });
        svg.innerHTML = markup.join(&#x27;&#x27;);
      }

      function selectedNode() { return nodes.find(node =&gt; node.id === selectedId) || nodes[0]; }

      function schemaRows(items, direction) {
        return items.map(item =&gt; `&lt;div class=&quot;gfc-schema-row&quot;&gt;&lt;code&gt;${esc(item[0])}&lt;/code&gt;&lt;span&gt;${esc(item[1])}&lt;/span&gt;&lt;button aria-label=&quot;删除变量&quot;&gt;×&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;) || `&lt;div class=&quot;gfc-schema-row&quot;&gt;&lt;code&gt;无${direction}&lt;/code&gt;&lt;span&gt;—&lt;/span&gt;&lt;button aria-label=&quot;删除变量&quot; disabled&gt;×&lt;/button&gt;&lt;/div&gt;`;
      }

      function renderInspector() {
        const node = selectedNode();
        const meta = typeMeta[node.type];
        root.querySelector(&#x27;#gfcInspectorType&#x27;).textContent = `${meta.label.toUpperCase()} NODE`;
        root.querySelector(&#x27;#gfcInspectorTitle&#x27;).textContent = node.title;
        root.querySelector(&#x27;#gfcInspectorId&#x27;).textContent = node.id;
        root.querySelector(&#x27;#gfcBodyTab&#x27;).textContent = meta.bodyLabel;
        let body = &#x27;&#x27;;
        if (panel === &#x27;config&#x27;) {
          body = `&lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcNodeName&quot;&gt;节点名称&lt;/label&gt;&lt;input class=&quot;gfc-input&quot; id=&quot;gfcNodeName&quot; value=&quot;${esc(node.title)}&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcNodeId&quot;&gt;节点 ID&lt;/label&gt;&lt;input class=&quot;gfc-input&quot; id=&quot;gfcNodeId&quot; value=&quot;${esc(node.id)}&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcNodeType&quot;&gt;节点类型&lt;/label&gt;&lt;input class=&quot;gfc-input&quot; id=&quot;gfcNodeType&quot; value=&quot;${esc(meta.label)}&quot; disabled&gt;&lt;/div&gt;`;
          if (node.type === &#x27;llm&#x27;) body += `&lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcNodeModel&quot;&gt;模型&lt;/label&gt;&lt;select class=&quot;gfc-select&quot; id=&quot;gfcNodeModel&quot;&gt;&lt;option&gt;${esc(node.model || &#x27;实验默认 Chat 模型&#x27;)}&lt;/option&gt;&lt;option&gt;单独指定模型&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;`;
          if (node.type === &#x27;subflow&#x27;) body += `&lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcSubflow&quot;&gt;引用流程&lt;/label&gt;&lt;input class=&quot;gfc-input&quot; id=&quot;gfcSubflow&quot; value=&quot;${esc(node.subflow || &#x27;&#x27;)}&quot;&gt;&lt;/div&gt;&lt;button class=&quot;gfc-mini-action&quot;&gt;&lt;i data-lucide=&quot;external-link&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;打开子流程&lt;/button&gt;`;
        } else if (panel === &#x27;contract&#x27;) {
          body = `&lt;div class=&quot;gfc-section-title&quot;&gt;输入变量&lt;/div&gt;&lt;div class=&quot;gfc-schema-list&quot;&gt;${schemaRows(node.inputs,&#x27;输入&#x27;)}&lt;/div&gt;&lt;button class=&quot;gfc-mini-action&quot; data-add-variable=&quot;input&quot;&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;添加输入&lt;/button&gt;
            &lt;div class=&quot;gfc-section-title&quot; style=&quot;margin-top:16px&quot;&gt;输出变量&lt;/div&gt;&lt;div class=&quot;gfc-schema-list&quot;&gt;${schemaRows(node.outputs,&#x27;输出&#x27;)}&lt;/div&gt;&lt;button class=&quot;gfc-mini-action&quot; data-add-variable=&quot;output&quot;&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;添加输出&lt;/button&gt;
            &lt;div class=&quot;gfc-contract-note&quot;&gt;&lt;i data-lucide=&quot;braces&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;连线按变量类型校验。下游节点只能选择当前节点已声明的输出。&lt;/span&gt;&lt;/div&gt;`;
        } else if (panel === &#x27;body&#x27;) {
          if (node.type === &#x27;script&#x27;) {
            body = `&lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcNodeBody&quot;&gt;Python Function&lt;/label&gt;&lt;textarea class=&quot;gfc-textarea&quot; id=&quot;gfcNodeBody&quot;&gt;${esc(node.code || &#x27;def run(inputs, context):\n    return {&quot;result&quot;: inputs}&#x27;)}&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;gfc-contract-note&quot;&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;函数返回值必须符合输出变量契约。&lt;/span&gt;&lt;/div&gt;`;
          } else if (node.type === &#x27;llm&#x27;) {
            body = `&lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcNodeBody&quot;&gt;Prompt&lt;/label&gt;&lt;textarea class=&quot;gfc-textarea&quot; id=&quot;gfcNodeBody&quot;&gt;${esc(node.prompt || &#x27;${context}\n\n请完成任务，并严格按照输出结构返回。&#x27;)}&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcResponseMode&quot;&gt;响应格式&lt;/label&gt;&lt;select class=&quot;gfc-select&quot; id=&quot;gfcResponseMode&quot;&gt;&lt;option&gt;Structured JSON&lt;/option&gt;&lt;option&gt;Text&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;`;
          } else if (node.type === &#x27;ifelse&#x27;) {
            body = `&lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcNodeBody&quot;&gt;布尔表达式&lt;/label&gt;&lt;textarea class=&quot;gfc-textarea&quot; id=&quot;gfcNodeBody&quot;&gt;${esc(node.condition || &#x27;inputs[&quot;value&quot;] != null&#x27;)}&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;gfc-contract-note&quot;&gt;&lt;i data-lucide=&quot;git-branch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;表达式只能产生 True 或 False，并从对应出口继续。&lt;/span&gt;&lt;/div&gt;`;
          } else if (node.type === &#x27;readstate&#x27; || node.type === &#x27;writestate&#x27;) {
            body = `&lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcNodeBody&quot;&gt;状态路径&lt;/label&gt;&lt;input class=&quot;gfc-input&quot; id=&quot;gfcNodeBody&quot; value=&quot;${esc(node.statePath || &#x27;agent.state&#x27;)}&quot;&gt;&lt;/div&gt;&lt;div class=&quot;gfc-field&quot;&gt;&lt;label&gt;写入策略&lt;/label&gt;&lt;select class=&quot;gfc-select&quot;&gt;&lt;option&gt;覆盖字段&lt;/option&gt;&lt;option&gt;合并对象&lt;/option&gt;&lt;option&gt;追加集合&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;`;
          } else if (node.type === &#x27;subflow&#x27;) {
            body = `&lt;div class=&quot;gfc-contract-note&quot;&gt;&lt;i data-lucide=&quot;boxes&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;该节点引用 ${esc(node.subflow || &#x27;尚未选择的子流程&#x27;)}，子流程的 Start/End 契约将映射为本节点输入输出。&lt;/span&gt;&lt;/div&gt;`;
          } else {
            body = `&lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcNodeBody&quot;&gt;节点定义&lt;/label&gt;&lt;textarea class=&quot;gfc-textarea&quot; id=&quot;gfcNodeBody&quot;&gt;${esc(node.condition || &#x27;使用固定输入输出契约执行该控制节点。&#x27;)}&lt;/textarea&gt;&lt;/div&gt;`;
          }
        } else {
          body = `&lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcTimeout&quot;&gt;超时&lt;/label&gt;&lt;select class=&quot;gfc-select&quot; id=&quot;gfcTimeout&quot;&gt;&lt;option&gt;30 秒&lt;/option&gt;&lt;option&gt;60 秒&lt;/option&gt;&lt;option&gt;120 秒&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
            &lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcRetry&quot;&gt;失败策略&lt;/label&gt;&lt;select class=&quot;gfc-select&quot; id=&quot;gfcRetry&quot;&gt;&lt;option&gt;停止当前流程&lt;/option&gt;&lt;option&gt;重试 1 次&lt;/option&gt;&lt;option&gt;使用回退输出&lt;/option&gt;&lt;option&gt;进入错误分支&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
            &lt;div class=&quot;gfc-field&quot;&gt;&lt;label for=&quot;gfcFallback&quot;&gt;回退输出&lt;/label&gt;&lt;textarea class=&quot;gfc-textarea&quot; id=&quot;gfcFallback&quot; style=&quot;min-height:120px&quot;&gt;{}&lt;/textarea&gt;&lt;/div&gt;`;
        }
        root.querySelector(&#x27;#gfcInspectorBody&#x27;).innerHTML = body;
        root.querySelectorAll(&#x27;[data-add-variable]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const target = button.dataset.addVariable === &#x27;input&#x27; ? node.inputs : node.outputs;
          target.push([button.dataset.addVariable === &#x27;input&#x27; ? &#x27;new_input&#x27; : &#x27;new_output&#x27;,&#x27;string&#x27;]);
          renderNodes();
          renderInspector();
        }));
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function addNode(type) {
        const meta = typeMeta[type];
        addedCount += 1;
        const id = `${meta.defaultName}_${addedCount}`;
        const columns = [3,36,69];
        const flow = flowStore[currentFlowKey];
        const baseY = Math.max(180, flow.height - 65);
        nodes.push({
          id,
          type,
          title: meta.title,
          x: columns[(addedCount - 1) % 3],
          y: baseY + Math.floor((addedCount - 1) / 3) * 170,
          inputs: type === &#x27;start&#x27; ? [] : [[&#x27;input&#x27;,&#x27;any&#x27;]],
          outputs: type === &#x27;end&#x27; ? [] : [[type === &#x27;ifelse&#x27; ? &#x27;matched&#x27; : &#x27;result&#x27;, type === &#x27;ifelse&#x27; ? &#x27;boolean&#x27; : &#x27;any&#x27;]],
          unconnected: true,
          code: type === &#x27;script&#x27; ? &#x27;def run(inputs, context):\n    return {&quot;result&quot;: inputs}&#x27; : undefined,
          prompt: type === &#x27;llm&#x27; ? &#x27;${context}\n\n请完成任务，并严格按照输出结构返回。&#x27; : undefined,
          condition: type === &#x27;ifelse&#x27; ? &#x27;inputs[&quot;value&quot;] != null&#x27; : undefined
        });
        selectedId = id;
        panel = &#x27;contract&#x27;;
        const board = root.querySelector(&#x27;#gfcBoard&#x27;);
        board.style.minHeight = `${1810 + Math.floor((addedCount - 1) / 3) * 170}px`;
        renderNodes();
        renderInspector();
        showToast(`${meta.label} 节点已添加，等待连接`);
      }

      function showToast(message) {
        const toast = root.querySelector(&#x27;#gfcToast&#x27;);
        toast.textContent = message;
        toast.classList.add(&#x27;show&#x27;);
        window.setTimeout(() =&gt; toast.classList.remove(&#x27;show&#x27;), 1800);
      }

      root.querySelectorAll(&#x27;.gfc-flow-tab&#x27;).forEach((tab, index, tabs) =&gt; {
        tab.addEventListener(&#x27;click&#x27;, () =&gt; switchFlow(tab.dataset.flow));
        tab.addEventListener(&#x27;keydown&#x27;, event =&gt; {
          if (event.key !== &#x27;ArrowLeft&#x27; &amp;&amp; event.key !== &#x27;ArrowRight&#x27;) return;
          event.preventDefault();
          const direction = event.key === &#x27;ArrowRight&#x27; ? 1 : -1;
          const next = tabs[(index + direction + tabs.length) % tabs.length];
          next.focus();
          switchFlow(next.dataset.flow);
        });
      });
      root.querySelector(&#x27;#gfcVersionHistory&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
        event.stopPropagation();
        setVersionPopover(root.querySelector(&#x27;#gfcVersionPopover&#x27;).hidden);
      });
      root.querySelector(&#x27;#gfcVersionClose&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setVersionPopover(false));
      root.querySelector(&#x27;#gfcVersionPopover&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; event.stopPropagation());
      root.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!root.querySelector(&#x27;#gfcVersionPopover&#x27;).hidden) setVersionPopover(false);
      });
      root.addEventListener(&#x27;keydown&#x27;, event =&gt; {
        if (event.key === &#x27;Escape&#x27;) setVersionPopover(false);
      });
      root.querySelectorAll(&#x27;.gfc-palette-item&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; addNode(button.dataset.add)));
      root.querySelector(&#x27;#gfcAddNode&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; addNode(&#x27;script&#x27;));
      root.querySelectorAll(&#x27;.gfc-inspector-tab&#x27;).forEach(tab =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; {
        panel = tab.dataset.panel;
        root.querySelectorAll(&#x27;.gfc-inspector-tab&#x27;).forEach(item =&gt; item.setAttribute(&#x27;aria-selected&#x27;, String(item === tab)));
        renderInspector();
      }));
      root.querySelector(&#x27;#gfcValidate&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;流程结构和变量类型校验通过&#x27;));
      root.querySelector(&#x27;#gfcSave&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelector(&#x27;#gfcSaveState&#x27;).textContent = &#x27;草稿已保存&#x27;;
        showToast(&#x27;流程草稿已保存到当前实验&#x27;);
      });
      root.querySelector(&#x27;#gfcApplyNode&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;节点配置已应用&#x27;));
      const canvasBoard = root.querySelector(&#x27;#gfcBoard&#x27;);
      canvasBoard.addEventListener(&#x27;dragover&#x27;, event =&gt; {
        if (!nativeDrag) return;
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = &#x27;move&#x27;;
      });
      canvasBoard.addEventListener(&#x27;drop&#x27;, event =&gt; {
        if (!nativeDrag) return;
        event.preventDefault();
        const boardRect = canvasBoard.getBoundingClientRect();
        const maxLeft = Math.max(0, boardRect.width - nativeDrag.button.offsetWidth);
        const left = Math.max(0, Math.min(maxLeft, event.clientX - boardRect.left - nativeDrag.offsetX));
        const top = Math.max(0, event.clientY - boardRect.top - nativeDrag.offsetY);
        nativeDrag.node.x = boardRect.width ? (left / boardRect.width) * 100 : 0;
        nativeDrag.node.y = top;
        const requiredHeight = top + nativeDrag.button.offsetHeight + 90;
        if (requiredHeight &gt; canvasBoard.clientHeight) canvasBoard.style.minHeight = `${requiredHeight}px`;
        selectedId = nativeDrag.node.id;
        root.querySelector(&#x27;#gfcSaveState&#x27;).textContent = &#x27;有未保存修改&#x27;;
        nativeDrag = null;
        renderNodes();
        renderInspector();
      });
      window.addEventListener(&#x27;resize&#x27;, drawEdges);

      renderNodes();
      renderInspector();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
