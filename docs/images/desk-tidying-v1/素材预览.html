rc="objects/desk-empty.png" alt="空书桌"></a><p>独立透明素材 · RGBA</p></article><article><h2>散放材料</h2><a href="objects/study-materials-scattered.png"><img src="objects/study-materials-scattered.png" alt="散放材料"></a><p>一本笔记本与三张讲义 · RGBA</p></article><article><h2>码齐材料</h2><a href="objects/study-materials-stacked.png"><img src="objects/study-materials-stacked.png" alt="码齐材料"></a><p>状态外观首版 · 比例待校准</p></article><article><h2>许知行</h2><a href="agents/xu-zhixing-reference.png"><img src="agents/xu-zhixing-reference.png" alt="许知行立绘"></a><p>22 岁虚构学生 · 独立角色参考</p></article></div><p>所有图片均为 1254×1254。此页面仅进行 CSS 图层展示，不生成或替换运行事实。</p></main><script>function change(b,s){document.querySelector('#materials').src='objects/study-materials-'+s+'.png';document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))}</script></html>
