    function semanticTreeRows(current,query=''){
      const path=current?semanticPath(current):['the Ville','霍布斯咖啡馆','咖啡馆','咖啡馆顾客座位'];
      const sectors=Object.keys(SEMANTIC_TREE);
      const q=query.trim().toLowerCase();
      let html=`<div class="tree-row${path[0]==='the Ville'&&current&&current.level==='world'?' selected':''}" data-semantic="world-root"><span class="tree-branch">⌄</span><span class="tree-label">the Ville</span><span class="tree-type">WORLD</span></div>`;
      sectors.forEach((sector,index)=>{
        const sectorMatches=!q||sector.toLowerCase().includes(q)||JSON.stringify(SEMANTIC_TREE[sector]).toLowerCase().includes(q);
        if(!sectorMatches)return;
        const open=Boolean(q)||sector===path[1]||index<2;
        html+=`<div class="tree-row depth-1${current&&current.level==='sector'&&current.name===sector?' selected':''}" data-semantic-name="${sector}" data-semantic-level="sector"><span class="tree-branch">${open?'⌄':'›'}</span><span class="tree-label">${sector}</span><span class="tree-type">S</span></div>`;
        if(!open)return;
        Object.entries(SEMANTIC_TREE[sector]).forEach(([arena,objects])=>{
          const arenaMatches=!q||arena.toLowerCase().includes(q)||objects.some(obj=>obj.toLowerCase().includes(q));
          if(!arenaMatches)return;
          const arenaOpen=Boolean(q)||(sector===path[1]&&arena===path[2]);
          html+=`<div class="tree-row depth-2${current&&current.level==='arena'&&current.name===arena?' selected':''}" data-semantic-name="${arena}" data-semantic-parent="${sector}" data-semantic-level="arena"><span class="tree-branch">${arenaOpen?'⌄':'›'}</span><span class="tree-label">${arena}</span><span class="tree-type">A</span></div>`;
          if(!arenaOpen)return;
          objects.filter(obj=>!q||obj.toLowerCase().includes(q)).forEach(obj=>{
            html+=`<div class="tree-row depth-3${current&&current.level==='game_object'&&current.name===obj?' selected':''}" data-semantic-name="${obj}" data-semantic-parent="${arena}" data-semantic-level="game_object"><span class="tree-branch">·</span><span class="tree-label">${obj}</span><span class="tree-type">O</span></div>`;
          });
        });
      });
      return html;
    }

    function definitionInspector(){const o=getManagedDefinition(),levelMeta=LEVEL_META[state.manageLevel];if(!o)return inspectorShell(`${levelMeta.label} 定义`,'⌛','正在建立节点索引','tilemap.json + maze.json','<span class="chip teal">READING</span>',`<div class="inspector-body"><div class="notice">正在读取真实地图图层、Tileset 与四层地址，请稍候。</div></div>`);if(o.recipe)return importedDefinitionInspector(o,levelMeta);const sheetMeta=SHEET_META[o.sheet]||{columns:16,rows:16};return inspectorShell(`${levelMeta.label} 定义`,definitionPreviewMarkup(o,true),o.name,`${o.id} · ${o.sheet}.png`,`<span class="chip teal">${escapeHtml(o.category||levelMeta.label)}</span><span class="chip">${o.w}×${o.h} 格</span><span class="chip purple">${levelMeta.mark} 层语义已配置</span>`,`<div class="inspector-body"><div class="panel-section"><div class="section-title"><h3>基本信息</h3><small>可修改</small></div><div class="field"><label>显示名称</label><input class="control" id="objectName" value="${escapeHtml(o.name)}"></div><div class="form-grid"><div class="field"><label>稳定键</label><input class="control" id="objectKey" value="${escapeHtml(o.id)}"></div><div class="field"><label>分类</label><select class="control" id="objectCategory">${levelMeta.categories.map(v=>`<option ${v===o.category?'selected':''}>${v}</option>`).join('')}</select></div></div></div><div class="panel-section"><div class="section-title"><h3>渲染节点类型</h3><small>不再限定单切片</small></div><div class="field"><label>类型</label><select class="control" id="objectRenderType">${RECIPE_TYPE_OPTIONS[state.manageLevel].map(v=>`<option ${v===o.renderType?'selected':''}>${v}</option>`).join('')}</select></div><div class="notice">基础素材可升级为单 Tile、多格 Stamp、Pattern、AutoTile 或跨图层 Prefab。</div></div><div class="panel-section"><div class="section-title"><h3>图形切片</h3><small>单 Tile / Stamp 来源</small></div><div class="field"><label>来源 spritesheet</label><select class="control" id="objectSheet">${Object.keys(SHEET_META).map(v=>`<option ${v===o.sheet?'selected':''}>${v}</option>`).join('')}</select>     function importedDefinitionInspector(o,levelMeta){const r=o.recipe,b=r.bounds,vb=r.visualBounds||b,linked=Boolean(o.imported),root=tilemapRuntime.maze?.world||'the Ville',address=[root,...(o.address||[]).filter(x=>x!==root)];return inspectorShell(`${levelMeta.label} · ${linked?'导入节点':'可编辑 Prefab'}`,definitionPreviewMarkup(o,true),o.name,`${linked?'tilemap.json ↔ maze.json':'由导入节点派生'} · ${o.id}`,`<span class="chip teal">${o.category}</span><span class="chip">${o.w}×${o.h} 格</span><span class="chip purple">${r.tileCount} Tiles</span>`,`<div class="inspector-body"><div class="panel-section"><div class="restore-check"><span>✓</span><span><strong>${linked?'可从源文件完整回放':'已保留完整图层配方'}</strong><small>该节点不是单个图标，而是 ${r.layers.length} 个 Tiled 图层中的 ${r.tileCount} 个 Tile 引用。</small></span></div></div><div class="panel-section"><div class="section-title"><h3>节点身份</h3><small>语义与图形分离</small></div><div class="field"><label>渲染节点类型</label><select class="control" id="importedRecipeType">${RECIPE_TYPE_OPTIONS[state.manageLevel].map(v=>`<option ${v===(o.renderType||o.category)?'selected':''}>${v}</option>`).join('')}</select></div><div class="key-value"><div class="key-row"><span>完整四层地址</span><strong>${address.join(' → ')}</strong></div><div class="key-row"><span>语义覆盖格</span><strong>${o.semanticCells||MAP_WIDTH*MAP_HEIGHT}</strong></div><div class="key-row"><span>语义锚点范围</span><strong>x ${b.x} · y ${b.y} · ${b.w}×${b.h}</strong></div>${r.viewLevel==='game_object'?`<div class="key-row"><span>识别图形范围</span><strong>x ${vb.x} · y ${vb.y} · ${vb.w}×${vb.h}</strong></div>`:''}<div class="key-row"><span>引用 Tileset</span><strong>${r.tilesets.length} 个</strong></div></div></div><div class="panel-section"><div class="section-title"><h3>视觉构成</h3><small>按 Tiled 顺序回放</small></div><div class="recipe-layer-list">${r.layerStats.length?r.layerStats.map(layer=>`<div class="recipe-layer-row"><strong>${escapeHtml(layer.name)}</strong><span>${VISUAL_LAYER_LEVEL[layer.name]}</span><span>${layer.count} tiles</s     function layerInspector(){const layer=LAYERS.find(l=>l.id===state.selectedLayerId)||LAYERS[0];const semantic=layer.category==='semantic';return inspectorShell('Tiled 图层','☷',layer.name,`layers[${LAYERS.indexOf(layer)}] · tilelayer`,`<span class="chip ${semantic?'blue':'teal'}">${layer.category}</span><span class="chip">${layer.visible?'可见':'已隐藏'}</span>${layer.locked?'<span class="chip orange">结构锁定</span>':''}`,`<div class="inspector-body"><div class="panel-section"><div class="section-title"><h3>图层属性</h3><small>Tiled 对齐</small></div><div class="field"><label>图层名称</label><input class="control" id="layerName" value="${layer.name}" ${layer.locked?'readonly':''}></div><label class="check-row" style="margin-bottom:8px"><span class="check-copy"><strong>画布可见</strong><small>只影响编辑预览</small></span><span class="switch"><input id="layerVisible" type="checkbox" ${layer.visible?'checked':''}><span></span></span></label><div class="field"><label>不透明度 <small id="opacityLabel">${layer.opacity}%</small></label><div class="range-row"><input id="layerOpacity" type="range" min="0" max="100" value="${layer.opacity}"><span class="range-value">${layer.opacity}%</span></div></div><div class="inline-actions"><button class="btn btn-sm" data-move-layer="up">↑ 上移</button><button class="btn btn-sm" data-move-layer="down">↓ 下移</button></div></div>${semantic?`<div class="panel-section"><div class="section-title"><h3>编译目标</h3></div><div class="key-value"><div class="key-row"><span>Tiled 功能层</span><code>${layer.name}</code></div><div class="key-row"><span>Maze 地址键</span><code>${layer.name.startsWith('World')?'world':layer.name.startsWith('Sector')?'sector':layer.name.startsWith('Arena')?'arena':'game_object'}</code></div><div class="key-row"><span>发布产物</span><code>maze.json</code></div></div></div><div class="notice">功能图层默认锁定几何顺序，避免视觉图层重排破坏地址编译。</div>`:`<div class="notice">该图层只参与地图视觉合成；关闭显示不会删除 Tile 数据。</div>`}</div>`)}

    function assetInspector(){let asset=getSelectedAsset();if(!asset){asset=world.spatial_scene.placements[0];state.selected={kind:'asset',id:asset.id}}const cat=ASSETS.find(a=>a.type===asset.asset_key)||ASSETS[0];const tabs=`<div class="inspector-tabs"><button class="inspector-tab${state.inspectorTab==='properties'?' active':''}" data-tab="properties">属性</button><button class="inspector-tab${state.inspectorTab==='state'?' active':''}" data-tab="state">状态</button><button class="inspector-tab${state.inspectorTab==='output'?' active':''}" data-tab="output">感知与输出</button></div>`;const body=state.inspectorTab==='output'?sensingPanel(asset):state.inspectorTab==='state'?assetStatePanel(asset):assetPropertyPanel(asset);return inspectorShell('空间资产',cat.icon,asset.appearance.label,`${asset.id} · ${asset.x_m.toFixed(1)}, ${asset.y_m.toFixed(1)}`,`<span class="chip teal">${cat.name}</span><span class="chip">感知半径 ${asset.sensing.radius_m} 格</span>${asset.rules.length?'<span class="chip orange">NL 输出已配置</span>':''}`,body,tabs)}
    function assetPropertyPanel(a){return`<div class="inspector-body"><div class="panel-section"><div class="section-title"><h3>位置与外观</h3><small>空间资产契约</small></div><div class="field"><label>显示名称</label><input class="control" id="assetLabel" value="${a.appearance.label}"></div><div class="form-grid"><div class="field"><label>X</label><input class="control" id="assetX" type="number" value="${a.x_m}" step=".5"></div><div class="field"><label>Y</label><input class="control" id="assetY" type="number" value="${a.y_m}" step=".5"></div></div><div class="field"><label>旋转</label><select class="control" id="assetRotation">${[0,45,90,135,180,225,270,315].map(v=>`<option value="${v}" ${v===a.rotation_deg?'selected':''}>${v}°</option>`).join('')}</select></div><label class="check-row"><span class="check-copy"><strong>物理碰撞</strong><small>与感知能力相互独立</small></span><span class="switch"><input id="assetCollision" type="checkbox" ${a.physics.collision?'checked':''}><span></span></span></label></div><div class="panel-section"><div class="section-title"><h3>语义锚点</h3></div><div class="serialized">${a.semantics.address.join(' → ')}</div></div><div class="inline-actions"><button class="btn btn-sm" id="duplicateAsset">⧉ 复制</button><button class="btn btn-sm" id="rotateAsset">↻ 旋转</button><button class="btn btn-danger btn-sm" id="deleteAsset">删除</button></div></div>`}

    function sensingPanel(a){const rule=a.rules[0]||{name:'新感知输出',enabled:true,trigger:'附近语义对象进入感知范围',observe:'选择观察对象',condition:'选择条件',recipient:'触发事件的主体',template:'你在 {arena} 附近触发了环境事件。'};const running=state.testRun&&!state.testRun.done;return`<div class="inspector-body"><div class="capability-intro"><span>⌁</span><span><b>资产不绑定 Agent。</b> 它只观察附近地图对象与状态，在条件成立时向“运行时事件主体”输出自然语言参数。</span></div><article class="capability-card"><div class="cap-head"><span><strong>${rule.name}</strong><small>${rule.enabled?'已启用':'已停用'} · environment-input/v1</small></span><label class="switch"><input id="ruleEnabled" type="checkbox" ${rule.enabled?'checked':''}><span></span></label></div><div class="cap-flow"><div class="flow-node ${running&&state.testRun.stage>=1?'active':''}"><span>Sense</span><strong>${rule.trigger}</strong></div><div class="flow-arrow ${running&&state.testRun.stage>=1?'active':''}">›</div><div class="flow-node ${running&&state.testRun.stage>=2?'active':''}"><span>Condition</span><strong>${rule.condition}</strong></div><div class="flow-arrow ${running&&state.testRun.stage>=2?'active':''}">›</div><div class="flow-node ${running&&state.testRun.stage>=3?'active':''}"><span>NL Payload</span><strong>输出自然语言参数</strong></div></div><div class="cap-editor"><div class="field"><label>感知范围 <small>以资产为中心</small></label><div class="range-row"><input id="senseRadius" type="range" min="1" max="12" value="${a.sensing.radius_m}"><span class="range-value" id="senseRadiusValue">${a.sensing.radius_m} 格</span></div></div>${selectField('何时采样','ruleTrigger',['附近语义对象进入感知范围','附近对象状态发生变化','Game Object 事件被更新'],rule.trigger)}${selectField('观察内容','ruleObserve',['移动实体穿过「停止线」','主体随身物品中不存在「门禁卡」','附近 Game Object 状态','感知范围内的事件主体'],rule.observe)}${selectField('条件','ruleCondition',['phase = VEHICLE_RED','locked = true','附近对象数量 > 0','状态与上一帧不同'],rule.condition)}${selectField('参数交给谁','ruleRecipient',['触发事件的主体','感知范围内的全部事件主体'],rule.recipient)}<div class="field"><label>自然语言参数模板 <small>运行时变量</small></label><te     instanceEditorInspector=function(){const d=state.instanceEditor,worldName=tilemapRuntime.maze?.world||'the Ville',sectors=importedRegistry('sector'),sector=sectors.find(item=>item.id===d.sectorId)||sectors[0],arenas=importedRegistry('arena').filter(item=>item.address?.[0]===sector?.name),arena=arenas.find(item=>item.id===d.arenaId)||arenas[0],families=tilemapRuntime.objectFamilies,family=families.find(item=>item.id===d.familyId)||families[0],variants=family?.variants||[],variant=variants.find(item=>item.id===d.variantId)||variants[0],preview=definitionPreviewMarkup(variant?.representative||family?.representative,true),rows=worldNodeAddressRow(1,'World',`<strong>${escapeHtml(worldName)}</strong>`)+worldNodeAddressRow(2,'Sector',`<select class="control" id="instanceSector">${sectors.map(item=>`<option value="${item.id}" ${item.id===sector?.id?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select>`)+worldNodeAddressRow(3,'Arena',`<select class="control" id="instanceArena">${arenas.map(item=>`<option value="${item.id}" ${item.id===arena?.id?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select>`)+worldNodeAddressRow(4,'Game Object',`<select class="control" id="instanceFamily">${families.map(item=>`<option value="${item.id}" ${item.id===family?.id?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select>`);return inspectorShell('Game Object 节点',preview,d.mode==='create'?'新建 Game Object':family?.name||'Game Object',[worldName,sector?.name,arena?.name,family?.name].filter(Boolean).join(' → '),`<span class="chip teal">Game Object</span><span class="chip purple">${variant?.name||'视觉变体'}</span>`,`<div class="inspector-body"><div class="panel-section"><div class="section-title"><h3>当前地址</h3></div><div class="address-stack">${rows}</div></div><div class="panel-section"><div class="section-title"><h3>视觉变体</h3></div><select class="control" id="instanceVariant">${variants.map((item,index)=>`<option value="${item.id}" ${item.id===variant?.id?'selected':''}>V${index+1} · ${escapeHtml(item.name)}</option>`).join('')}</select></div><div class="panel-section"><div class="section-title"><h3>地图位置</h3></div><div class="form-grid"><div class="field"><label>X</label><input class="control" id="instanceX" type="number" min="0" max="${MAP_WIDTH-1}" value="${d.x}"></div><div class="field"><label>Y</label><input class="control" id="instanceY" type="number" min="0" max="${MAP_HEIGHT-1}" value="${d.y}"></div></div></div><div class="inline-actions node-save-actions"><button class="btn btn-primary btn-sm" id="saveInstanceEditor">保存</button></div></div>`)};
    const familyEditorInspectorBeforeQuietUi=familyEditorInspector;
    familyEditorInspector=function(){return familyEditorInspectorBeforeQuietUi().replace(/<div class="editor-steps">[\s\S]*?<\/div>/g,'').replace(/<div class="editor-callout">[\s\S]*?<\/div>/g,'').replace(/<button class="btn btn-sm" id="cancelFamilyEditor">取消<\/button>/g,'').replace(/(<button class="btn btn-primary btn-sm" id="saveFamilyEditor">)[^<]+(<\/button>)/g,'$1保存$2').replace(/(<h3>)\d+\s*·\s*/g,'$1').replace('Game Object 向导','Game Object 节点')};
    instanceEditorInspector=function(){
      const d=state.instanceEditor,worldName=tilemapRuntime.maze?.world||'the Ville',sectors=importedRegistry('sector'),sector=sectors.find(item=>item.id===d.sectorId)||sectors[0],arenas=importedRegistry('arena').filter(item=>item.address?.[0]===sector?.name),arena=arenas.find(item=>item.id===d.arenaId)||arenas[0],families=tilemapRuntime.objectFamilies,family=families.find(item=>item.id===d.familyId)||families[0],graphic=family?.variants?.find(item=>item.id===d.variantId)?.representative||family?.representative||family?.variants?.[0]?.representative,instance=d.instanceId?findFamilyInstance(d.instanceId):null,bounds=instance?.mapBounds||{x:d.x,y:d.y,w:graphic?.w||1,h:graphic?.h||1},semantic=instance?.semantic||family?.semantic||graphic?.semantic||family?.name||'Game Object',preview=definitionPreviewMarkup(graphic,true),rows=worldNodeAddressRow(1,'World',`<strong>${escapeHtml(worldName)}</strong>`)+worldNodeAddressRow(2,'Sector',`<select class="control" id="instanceSector">${sectors.map(item=>`<option value="${item.id}" ${item.id===sector?.id?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select>`)+worldNodeAddressRow(3,'Arena',`<select class="control" id="instanceArena">${arenas.map(item=>`<option value="${item.id}" ${item.id===arena?.id?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select>`)+worldNodeAddressRow(4,'Game Object',`<select class="control" id="instanceFamily">${families.map(item=>`<option value="${item.id}" ${item.id===family?.id?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select>`);
      return inspectorShell('Game Object 节点',preview,d.mode==='create'?'新建 Game Object':family?.name||'Game Object',[worldName,sector?.name,arena?.name,family?.name].filter(Boolean).join(' → '),`<span class="chip teal">Game Object</span><span class="chip purple">${bounds.w}×${bounds.h} 格</span>`,`<div class="inspector-body"><div class="panel-section"><div class="section-title"><h3>当前地址</h3></div><div class="address-stack">${rows}</div></div><div class="panel-section"><div class="section-title"><h3>空间范围</h3></div><div class="form-grid"><div class="field"><label>X</label><input class="control" id="instanceX" type="number" min="0" max="${MAP_WIDTH-1}" value="${bounds.x}"></div><div class="field"><label>Y</label><input class="control" id="instanceY" type="number" min="0" max="${MAP_HEIGHT-1}" value="${bounds.y}"></div><div class="field"><label>宽度</label><input class="control" id="instanceW" type="number" min="1" max="${MAP_WIDTH}" value="${bounds.w}"></div><div class="field"><label>高度</label><input class="control" id="instanceH" type="number" min="1" max="${MAP_HEIGHT}" value="${bounds.h}"></div></div></div><div class="panel-section"><div class="field"><label>空间语义</label><textarea class="control" id="instanceSemantic" rows="3">${escapeHtml(semantic)}</textarea></div></div><div class="inline-actions node-save-actions"><button class="btn btn-primary btn-sm" id="saveInstanceEditor">保存</button></div></div>`)
    };
    const saveInstanceEditorBeforeSpatialUi=saveInstanceEditor;
    saveInstanceEditor=function(){const draft=state.instanceEditor;if(!draft)return;const existingId=draft.instanceId,w=Math.max(1,Math.round(Number(document.getElementById('instanceW')?.value)||1)),h=Math.max(1,Math.round(Number(document.getElementById('instanceH')?.value)||1)),semantic=document.getElementById('instanceSemantic')?.value.trim()||'Game Object';saveInstanceEditorBeforeSpatialUi();if(state.instanceEditor)return;const id=existingId||state.selected?.id,instance=findFamilyInstance(id);if(!instance)return;const bounds={x:instance.x,y:instance.y,w:clamp(w,1,MAP_WIDTH-instance.x),h:clamp(h,1,MAP_HEIGHT-instance.y)};Object.assign(instance,{w:bounds.w,h:bounds.h,semantic,mapBounds:{...bounds}});const visual=world.definition.editor.visualObjects.find(item=>item.id===id);if(visual)Object.assign(visual,{w:bounds.w,h:bounds.h,semantic,mapBounds:{...bounds}});renderAll()};
    renderHud=function(){const root=document.getElementById('mapHud');if(root)root.textContent=''};
    const showToastBeforeTermCleanup=showToast;
    showToast=function(title,copy){showToastBeforeTermCleanup(normalizeUiTerms(title),normalizeUiTerms(copy))};
    const updateStatusBeforeTermCleanup=updateStatus;
    updateStatus=function(){updateStatusBeforeTermCleanup();['canvasModeLabel','interactionHint','selectionStatus','activeContext'].forEach(id=>{const element=document.getElementById(id);if(element)element.textContent=normalizeUiTerms(element.textContent)})};
    const drawMaterialsWorkbenchBeforeTermCleanup=drawMaterialsWorkbench;
    drawMaterialsWorkbench=function(rect){const fillText=ctx.fillText;ctx.fillText=function(value,...args){return fillText.call(this,normalizeUiTerms(value),...args)};try{drawMaterialsWorkbenchBeforeTermCleanup(rect)}finally{ctx.fillText=fillText}};

    function snapshot(){state.history.push(JSON.stringify({cells:world.definition.editor.cells,visualObjects:world.definition.editor.visualObjects,tiles:world.definition.tiles,placements:world.spatial_scene.placements,layers:LAYERS,semantics:SEMANTIC_REGIONS,registry:OBJECT_REGISTRY,levelLibrary:LEVEL_LIBRARY,materialSlices:MATERIAL_SLICE_LIBRARY}));if(state.history.length>24)state.history.shift();state.future=[];updateHistory()}
    function currentSnapshot(){return JSON.stringify({cells:world.definition.editor.cells,visualObjects:world.definition.editor.visualObjects,tiles:world.definition.tiles,placements:world.spatial_scene.placements,layers:LAYERS,semantics:SEMANTIC_REGIONS,registry:OBJECT_REGISTRY,levelLibrary:LEVEL_LIBRARY,materialSlices:MATERIAL_SLICE_LIBRARY})}
    function restore(v){const d=JSON.parse(v);world.definition.editor.cells=d.cells;world.definition.editor.visualObjects=d.visualObjects||[];world.definition.tiles=d.tiles;world.spatial_scene.placements=d.placements;LAYERS.splice(0,LAYERS.length,...d.layers);SEMANTIC_REGIONS.splice(0,SEMANTIC_REGIONS.length,...d.semantics);if(d.registry)OBJECT_REGISTRY.splice(0,OBJECT_REGISTRY.length,...d.registry);if(d.levelLibrary)Object.keys(LEVEL_LIBRARY).forEach(level=>LEVEL_LIBRARY[level].splice(0,LEVEL_LIBRARY[level].length,...d.levelLibrary[level]));if(d.materialSlices)MATERIAL_SLICE_LIBRARY.splice(0,MATERIAL_SLICE_LIBRARY.length,...d.materialSlices);Object.keys(state.selectedDefinitionIds).forEach(level=>{const list=definitionRegistry(level);if(!list.some(o=>o.id===state.selectedDefinitionIds[level]))state.selectedDefinitionIds[level]=list[0].id});if(!MATERIAL_SLICE_LIBRARY.some(s=>s.id===state.materialSliceId)){const slice=materialSlices()[0]||null;state.materialSliceId=slice?.id||'';setMaterialDraft(slice)}}
    function undo(){if(!state.history.length)return;state.future.push(currentSnapshot());restore(state.history.pop());state.testRun=null;markDirty();renderAll();showToast('已撤销','返回上一步地图状态')}
    function redo(){if(!state.future.length)return;state.history.push(currentSnapshot());restore(state.future.pop());state.testRun=null;markDirty();renderAll();showToast('已重做','已恢复下一步地图状态')}
    function updateHistory(){document.getElementById('undoButton').disabled=!state.history.length;document.getElementById('redoButton').disabled=!state.future.length}
    function markDirty(render=true){state.dirty=true;updateSaveState();updateHistory();if(render)updateStatus()}function updateSaveState(){document.getElementById('saveState').textContent=state.dirty?'有未保存更改':'所有更改已保存'}
    function keyDown(e){if(e.target.matches('input,select,textarea'))return;if(e.code==='Space'){e.preventDefault();state.spaceDown=true}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}}
    function showToast(title,copy){const t=document.getElementById('toast');document.getElementById('toastTitle').textContent=title;document.getElementById('toastCopy').textContent=copy;clearTimeout(toastTimer);t.classList.remove('show');requestAnimationFrame(()=>t.classList.add('show'));toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
    function clamp(v,min,max){return Math.max(min,Math.min(max,v))}function escapeHtml(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function init(){renderAll();bind();updateHistory();resizeCanvas();new ResizeObserver(resizeCanvas).observe(host);loadTilemapAssets();requestAnimationFrame(()=>{fitMap();showToast('斯坦福小镇地图正在载入','正在用现有 spritesheet 合成真实地图图形')})}
    init();
  })();
