<!--
  Agent Foundry · 斯坦福小镇地图设计工作区（高保真交互原型 v8）
  这是用于确认交互与信息架构的设计稿，不是产品代码。
  单文件、无构建、无外部依赖；示例结构对齐仓库中的 village/tilemap.json 与 maze.json。
  v8 相对 v7 补齐的编辑能力：
  1. 语义区域可编辑：移动 / 缩放 / 删除 / 改父级，X/Y/W/H 变为真实输入；
  2. 绘制增强：洪水填充、连续铺路（点起点-终点）、碰撞画笔、碰撞层显隐；
  3. 对象实例可在画布上拖拽移动；新增矩形框选（多选对象与资产，Delete 批量删除、整体拖动）；
  4. 导入 Tiled / 导出地图包 JSON / 版本历史（fork / 设为草稿）；
  5. 发布前校验（阻塞项 / 警告清单，阻塞项未清零不可发布）；
  6. Agent 出生点：点击放置 / 自动分配空闲位置 / 可通行性校验；
  7. 地图信息（世界名 / tile 尺寸）；快捷键 Delete、Ctrl+D、Esc。
-->

    function materialsRail(){const sheets=tilemapRuntime.map?.tilesets?.filter(t=>!t.name.startsWith('blocks'))||TILESETS;return`${railHead('素材库',`${sheets.length} 个 Tileset`)}<section class="rail-section">${sourceCard()}</section><section class="rail-section"><div class="architecture-note"><strong>素材只定义一次</strong>Game Object 使用 Tile / Stamp；Arena、Sector、World 还可以引用下一级节点。素材库不保存空间实例。</div></section><section class="rail-section"><div class="section-title"><h2>真实图集</h2><small>tilemap.json</small></div><div class="tileset-list">${sheets.map(t=>{const name=t.name||t[0],count=t.tilecount||t.count||t[1];return`<button class="tileset-row${state.selectedTileset===name?' active':''}" data-builder-tileset="${name}"><span class="tileset-thumb"></span><span class="tileset-copy"><strong>${name}</strong><small>${SHEET_META[name]?.file||'Tiled source'}</small></span><span class="tileset-count">${count}</span></button>`}).join('')}</div></section>`}

    function railHead(title,meta){return`<div class="rail-head"><strong>${title}</strong><small>${meta}</small></div>`}
    function sourceCard(){return`<div class="source-card"><div class="source-card-top"><strong>斯坦福小镇 Tiled 工程</strong><span class="chip teal">${tilemapRuntime.status==='ready'?'已解析':'解析中'}</span></div><p>tilemap.json 负责图形配方；maze.json 负责四层名称与地址。列表节点由两者联合生成。</p><div class="source-stats"><span class="source-stat"><b>140×100</b><span>Tile</span></span><span class="source-stat"><b>17</b><span>图层</span></span><span class="source-stat"><b>18</b><span>Tileset</span></span></div></div>`}
    function spriteUrl(sheet){return`${SHEET_BASE}${(SHEET_META[sheet]||{}).file||sheet+'.png'}`}
    function spriteMarkup(item,large=false){const w=Math.max(1,Number(item.w)||1),h=Math.max(1,Number(item.h)||1),box=large?50:40,scale=Math.min(1,box/(w*32),box/(h*32));return`<span class="sprite-preview${large?' large':''}"><i style="width:${w*32}px;height:${h*32}px;background-image:url('${spriteUrl(item.sheet)}');background-position:${-item.col*32}px ${-item.row*32}px;transform:translate(-50%,-50%) scale(${scale})"></i></span>`}
    function definitionRegistry(level){return level==='game_object'?OBJECT_REGISTRY:LEVEL_LIBRARY[level]||[]}
    function managedRegistry(){return state.catalogView==='imported'?importedRegistry(state.manageLevel):definitionRegistry(state.manageLevel)}

    function focusLegend(){const selectedIndex=LEVEL_ORDER.indexOf(state.paletteLevel),visible=state.focusHigherLevels?LEVEL_ORDER.slice(0,selectedIndex+1):LEVEL_ORDER,hidden=state.focusHigherLevels?LEVEL_ORDER.slice(selectedIndex+1):[];return`<div class="focus-chain">${LEVEL_ORDER.map((id,i)=>`<span class="focus-level${state.focusHigherLevels&&i>selectedIndex?' suppressed':''}">${LEVEL_META[id].mark} · ${LEVEL_META[id].label}</span>`).join('')}</div><p class="focus-note"><b>当前显示：</b>${visible.map(id=>LEVEL_META[id].label).join(' + ')}${hidden.length?`<br>已临时隐藏：${hidden.map(id=>LEVEL_META[id].label).join('、')} 与上层覆盖物`:''}</p>`}
    function paletteCards(items){return items.map(item=>`<button class="palette-card${state.paletteId===item.id?' active':''}" data-palette-id="${item.id}">${definitionPreviewMarkup(item)}<span class="palette-copy"><strong>${escapeHtml(item.name)}</strong><small>${item.imported?`${escapeHtml((item.address||[]).slice(0,-1).join(' / ')||item.category)} · ${item.recipe.layers.length} 层`: `${item.sheet} · ${item.w}×${item.h} 格`}</small></span><span class="palette-meta">${item.imported?`${item.recipe.tileCount}t`:state.paletteLevel==='game_object'?(item.usage||0)+'×':'32px'}</span></button>`).join('')}
    function catalogSourceCard(){const c=tilemapRuntime.catalog;return`<div class="catalog-source"><div class="catalog-source-head"><span><strong>导入节点不是手写列表</strong><small>图形取自 tilemap.json，层级名称取自 maze.json</small></span><span class="catalog-ready">${tilemapRuntime.status==='ready'?'READY':'READING'}</span></div><div class="catalog-counts">${LEVEL_ORDER.map(level=>`<span class="catalog-count"><b>${c[level].length||'—'}</b><span>${LEVEL_META[level].label}</span></span>`).join('')}</div></div>`}

    function visualRail(){const items=activePalette(),meta=LEVEL_META[state.paletteLevel];return`${railHead('素材与视觉','四层可定义素材')}<section class="rail-section">${sourceCard()}</section><section class="rail-section"><div class="section-title"><h2>绘制工具</h2><small>${state.paletteSource==='imported'?'复合配方画笔':'基础 Tile / Stamp'}</small></div><div class="tool-row" style="grid-template-columns:repeat(4,1fr)">${toolButton('select','↖','选择')}${toolButton('brush','✎','画笔')}${toolButton('eraser','⌫','橡皮')}${toolButton('pan','✥','平移')}</div></section><section class="rail-section"><div class="section-title"><h2>四层素材清单</h2><small>逐层定义地图</small></div><div class="definition-tabs">${definitionTabs(state.paletteLevel,'data-palette-level')}</div>${catalogTabs(state.paletteSource,'data-palette-source')}<p class="catalog-explain">${state.paletteSource==='imported'?'<b>复合节点：</b>保留原地图的图层组合与 Tile 引用，可完整还原。':'<b>基础素材：</b>单 Tile、Stamp、Pattern 与自定义 Prefab。'}</p><div class="palette-list" style="margin-top:8px">${paletteCards(items)}</div><button class="btn btn-sm" data-open-definitions style="width:100%;margin-top:8px">◆ 管理 ${meta.label} 定义</button></section><section class="rail-section"><div class="focus-card"><div class="focus-head"><span><strong>层级聚焦</strong><small>选择层级时自动隐藏更高层</small></span><label class="switch"><input id="layerFocusEnabled" type="checkbox" ${state.focusHigherLevels?'checked':''}><span></span></label></div>${focusLegend()}</div></section><section class="rail-section"><label class="paint-policy"><input id="paintSemantic" type="checkbox" ${state.paintSemantic?'checked':''}><span><strong>绘制图形时同步写入本层语义</strong><small>视觉配方与 Maze 地址分别保存，可独立换皮。</small></span></label></section>`}
    function objectRail(query=''){const meta=LEVEL_META[state.manageLevel],registry=managedRegistry(),q=query.trim().toLowerCase(),items=registry.filter(o=>!q||`${o.name} ${o.category} ${o.sheet||''} ${(o.address||[]).join(' ')}`.toLowerCase().includes(q)),selectedId=state.catalogView==='imported'?state.selectedImportedIds[state.manageLevel]:state.selectedDefinitionIds[state.manageLevel];return`${railHead('四层定义管理',`${meta.label} · ${registry.length} 个节点`)}<section class="rail-section">${catalogSourceCard()}</section><section class="rail-section"><div class="definition-tabs">${definitionTabs(state.manageLevel,'data-manage-level')}</div>${catalogTabs(state.catalogView,'data-catalog-view')}<div class="architecture-note"><strong>${state.catalogView==='imported'?'可还原的复合节点':'可复用的基础素材'}</strong>${state.catalogView==='imported'?'每个节点保存语义范围内的完整 Tiled 图层快照；层级聚焦决定编辑时显示到哪一层，因此预览与原地图一致。':'用于新建单 Tile、Stamp、Pattern、AutoTile 或跨图层 Prefab，不再只限定为单张切片。'}</div></section><section class="rail-section"><div class="registry-actions"><button class="btn btn-primary btn-sm" id="newDefinition">＋ 新建自定义</button><button class="btn btn-sm" id="duplicateDefinition">${state.catalogView==='imported'?'⧉ 转为 Prefab':'⧉ 复制'}</button></div><div class="search" style="margin-top:8px"><input class="control" id="definitionSearch" placeholder="搜索节点 / 地址 / 图集"></div></section><section class="rail-section"><div class="section-title"><h2>${state.catalogView==='imported'?'导入地图节点':'基础素材与自定义'}</h2><small id="definitionVisibleCount">${items.length} / ${registry.length}</small></div><div class="object-registry">${items.length?items.map(o=>`<button class="object-row${selectedId===o.id?' active':''}" data-definition-id="${o.id}">${definitionPreviewMarkup(o)}<span class="object-copy"><strong>${escapeHtml(o.name)}</strong><small>${o.imported?`${escapeHtml((o.address||[]).slice(0,-1).join(' / ')||o.category)} · ${o.recipe.layers.length} 层 · ${o.recipe.tilesets.length} 图集`:`${escapeHtml(o.category||meta.label)} · ${o.sheet}`}</small></span><span class="object-count">${o.imported?`${o.recipe.tileCount}t`:(o.usage||0)+'×'}</span></button>`).join(''):'<div class="notice">正在从 tilemap.json 与 maze.json 建立节点索引…</div>'}</div></section>`}
    function toolButton(id,icon,label){return`<button class="tool-button${state.tool===id?' active':''}" data-tool="${id}">${icon} ${label}</button>`}
    function layerRail(){return`${railHead('图层栈','按 Tiled 顺序合成')}<section class="rail-section">${sourceCard()}</section><section class="rail-section"><div class="section-title"><h2>渲染与功能图层</h2><small>眼睛切换显示</small></div><div class="layer-list">${LAYERS.map(layer=>`<div class="layer-row${state.selectedLayerId===layer.id?' selected':''}" data-layer="${layer.id}"><button class="layer-eye${layer.visible?'':' off'}" data-layer-eye="${layer.id}" aria-label="${layer.visible?'隐藏':'显示'} ${layer.name}">${layer.visible?'◉':'○'}</button><span class="layer-copy"><strong>${layer.name}</strong><small>${layer.category==='visual'?'视觉合成':layer.category==='semantic'?'编译为空间语义':layer.category==='collision'?'碰撞数据':'运行时辅助'}</small></span><span class="layer-meta"><i class="layer-dot ${layer.category}"></i>${layer.locked?'⌑':''}</span></div>`).join('')}</div></section>`}
    function semanticRail(){const current=getSelectedSemantic();return`${railHead('四层语义','maze.json')}<section class="rail-section"><div class="architecture-note"><strong>完整地址不是普通画块</strong>四个功能图层编译为 <code>world / sector / arena / game_object</code>。选择层级后框选覆盖范围，父子关系自动校验。</div></section><section class="rail-section"><div class="section-title"><h2>当前编辑层级</h2><small>4 层</small></div><div class="semantic-levels">${[['world','W','World',1],['sector','S','Sector',19],['arena','A','Arena',63],['game_object','O','Game Object',222]].map(([id,mark,label,count])=>`<button class="semantic-level${state.semanticLevel===id?' active':''}" data-level="${id}"><span class="level-mark">${mark}</span><span>${label}</span><small>${count}</small></button>`).join('')}</div><div class="tool-row" style="margin-top:7px">${toolButton('select','↖','选择')}${toolButton('semantic-box','▧','框选')}${toolButton('pan','✥','平移')}</div></section><section class="rail-section"><div class="section-title"><h2>语义树</h2><small>19 / 63 / 222</small></div><div class="search" style="margin-bottom:7px"><input class="control" id="semanticSearch" placeholder="搜索地址或物品"></div><div class="semantic-tree">${semanticTreeRows(current)}</div></section>`}
    function semanticTreeRows(current,query=''){
      const path=current?semanticPath(current):['the Ville','霍布斯咖啡馆','咖啡馆','咖啡馆顾客座位'];
      const sectors=Object.keys(SEMANTIC_TREE);
      const q=query.trim().toLowerCase();
      let html=`<div class="tree-row${path[0]==='the Ville'&&current&&current.level==='world'?' selected':''}" data-semantic="world-root"><span class="tree-branch">⌄</span><span class="tree-label">the Ville</span><span class="tree-type">WORLD</span></div>`;
      sectors.forEach((sector,index)=>{
        const sectorMatches=!q||sector.toLowerCase().includes(q)||JSON.stringify(SEMANTIC_TREE[sector]).toLowerCase().includes(q);
        if(!sectorMatches)return;
        const open=Boolean(q)||sector===path[1]||index<2;
        html+=`<div class="tree-row depth-1${current&&current.level==='sector'&&current.name===sector?' selected':''}" data-semantic-name="${sector}" data-semantic-level="sector"><span class="tree-branch">${open?'⌄':'›'}</span><span class="tree-label">${sector}</span><span class="tree-type">S</span></div>`;
        if(!open)return;
        Object.entries(SEMANTIC_TREE[sector]).forEach(([arena,objects])=>{
          const arenaMatches=!q||arena.toLowerCase().includes(q)||objects.some(obj=>obj.toLowerCase().includes(q));
          if(!arenaMatches)return;
          const arenaOpen=Boolean(q)||(sector===path[1]&&arena===path[2]);
          html+=`<div class="tree-row depth-2${current&&current.level==='arena'&&current.name===arena?' selected':''}" data-semantic-name="${arena}" data-semantic-parent="${sector}" data-semantic-level="arena"><span class="tree-branch">${arenaOpen?'⌄':'›'}</span><span class="tree-label">${arena}</span><span class="tree-type">A</span></div>`;
          if(!arenaOpen)return;
          objects.filter(obj=>!q||obj.toLowerCase().includes(q)).forEach(obj=>{
            html+=`<div class="tree-row depth-3${current&&current.level==='game_object'&&current.name===obj?' selected':''}" data-semantic-name="${obj}" data-semantic-parent="${arena}" data-semantic-level="game_object"><span class="tree-branch">·</span><span class="tree-label">${obj}</span><span class="tree-type">O</span></div>`;
          });
        });
      });
      return html;
    }
    function assetRail(){return`${railHead('空间资产','环境能力')}<section class="rail-section"><div class="architecture-note"><strong>不在地图中绑定 Agent</strong>资产只感知附近语义对象和状态；条件成立后，把一段自然语言参数交给运行时事件主体。</div></section><section class="rail-section"><div class="section-title"><h2>资产工具</h2><small>拖入画布</small></div><div class="tool-row">${toolButton('select','↖','选择')}${toolButton('asset','◇','放置')}${toolButton('pan','✥','平移')}</div></section><section class="rail-section"><div class="section-title"><h2>空间资产库</h2><small>5 个契约</small></div><div class="asset-list">${ASSETS.map(a=>`<button class="asset-card" draggable="true" data-asset-type="${a.type}"><span class="asset-visual"><span class="asset-icon">${a.icon}</span><span class="asset-drag">⠿</span></span><strong class="asset-name">${a.name}</strong><small>${a.hint}</small></button>`).join('')}</div></section><section class="rail-section"><div class="section-title"><h2>运行时边界</h2></div><div class="key-value"><div class="key-row"><span>地图负责</span><strong>感知 / 条件 / NL 参数</strong></div><div class="key-row"><span>运行时负责</span><strong>把参数交给事件主体</strong></div><div class="key-row"><span>Agent 负责</span><strong>理解输入并修改行为</strong></div></div></section>`}

    function renderInspector(){const root=document.getElementById('inspector');if(state.utilityPanel){root.innerHTML=state.utilityPanel==='layers'?layerInspector():state.utilityPanel==='semantics'?semanticInspector():assetInspector()}else if(state.builderLevel==='materials'){root.innerHTML=materialsInspector()}else if(state.builderLevel==='game_object'&&state.familyEditor){root.innerHTML=familyEditorInspector()}else if(state.builderLevel==='game_object'&&state.editingFamilyDefinition){root.innerHTML=`<div class="utility-back"><button id="closeFamilyEditor">← 返回对象族</button></div>${definitionInspector()}`}else{root.innerHTML=builderInspector()}queueRecipePreviews(root)}

    function assetPropertyPanel(a){return`<div class="inspector-body"><div class="panel-section"><div class="section-title"><h3>位置与外观</h3><small>空间资产契约</small></div><div class="field"><label>显示名称</label><input class="control" id="assetLabel" value="${a.appearance.label}"></div><div class="form-grid"><div class="field"><label>X</label><input class="control" id="assetX" type="number" value="${a.x_m}" step=".5"></div><div class="field"><label>Y</label><input class="control" id="assetY" type="number" value="${a.y_m}" step=".5"></div></div><div class="field"><label>旋转</label><select class="control" id="assetRotation">${[0,45,90,135,180,225,270,315].map(v=>`<option value="${v}" ${v===a.rotation_deg?'selected':''}>${v}°</option>`).join('')}</select></div><label class="check-row"><span class="check-copy"><strong>物理碰撞</strong><small>与感知能力相互独立</small></span><span class="switch"><input id="assetCollision" type="checkbox" ${a.physics.collision?'checked':''}><span></span></span></label></div><div class="panel-section"><div class="section-title"><h3>语义锚点</h3></div><div class="serialized">${a.semantics.address.join(' → ')}</div></div><div class="inline-actions"><button class="btn btn-sm" id="duplicateAsset">⧉ 复制</button><button class="btn btn-sm" id="rotateAsset">↻ 旋转</button><button class="btn btn-danger btn-sm" id="deleteAsset">删除</button></div></div>`}
    function assetStatePanel(a){if(a.asset_key==='traffic-light'){const red=(a.initial_state.phase||'').includes('RED');return`<div class="inspector-body"><div class="panel-section"><div class="section-title"><h3>信号灯状态</h3><small>initial_state.phase</small></div><div class="check-row" style="margin-bottom:8px"><span class="check-copy"><strong>当前相位</strong><small>${a.initial_state.phase}</small></span><span style="width:18px;height:18px;border-radius:50%;background:${red?'#d84e47':'#40a362'};box-shadow:0 0 0 4px ${red?'#fff0ee':'#e7f5eb'}"></span></div><div class="inline-actions"><button class="btn ${red?'btn-primary':''} btn-sm" data-phase="VEHICLE_RED">红灯</button><button class="btn ${!red?'btn-primary':''} btn-sm" data-phase="VEHICLE_GREEN">绿灯</button></div></div><div class="notice">状态变化只是能力的输入之一；资产不会在地图配置阶段直接操作 Agent。</div></div>`}return`<div class="inspector-body"><div class="panel-section"><div class="section-title"><h3>初始状态</h3></div><div class="serialized">${escapeHtml(JSON.stringify(a.initial_state,null,2))}</div></div><div class="notice">状态由仿真运行时维护，地图版本只保存初始快照。</div></div>`}
    function sensingPanel(a){const rule=a.rules[0]||{name:'新感知输出',enabled:true,trigger:'附近语义对象进入感知范围',observe:'选择观察对象',condition:'选择条件',recipient:'触发事件的主体',template:'你在 {arena} 附近触发了环境事件。'};const running=state.testRun&&!state.testRun.done;return`<div class="inspector-body"><div class="capability-intro"><span>⌁</span><span><b>资产不绑定 Agent。</b> 它只观察附近地图对象与状态，在条件成立时向“运行时事件主体”输出自然语言参数。</span></div><article class="capability-card"><div class="cap-head"><span><strong>${rule.name}</strong><small>${rule.enabled?'已启用':'已停用'} · environment-input/v1</small></span><label class="switch"><input id="ruleEnabled" type="checkbox" ${rule.enabled?'checked':''}><span></span></label></div><div class="cap-flow"><div class="flow-node ${running&&state.testRun.stage>=1?'active':''}"><span>Sense</span><strong>${rule.trigger}</strong></div><div class="flow-arrow ${running&&state.testRun.stage>=1?'active':''}">›</div><div class="flow-node ${running&&state.testRun.stage>=2?'active':''}"><span>Condition</span><strong>${rule.condition}</strong></div><div class="flow-arrow ${running&&state.testRun.stage>=2?'active':''}">›</div><div class="flow-node ${running&&state.testRun.stage>=3?'active':''}"><span>NL Payload</span><strong>输出自然语言参数</strong></div></div><div class="cap-editor"><div class="field"><label>感知范围 <small>以资产为中心</small></label><div class="range-row"><input id="senseRadius" type="range" min="1" max="12" value="${a.sensing.radius_m}"><span class="range-value" id="senseRadiusValue">${a.sensing.radius_m} 格</span></div></div>${selectField('何时采样','ruleTrigger',['附近语义对象进入感知范围','附近对象状态发生变化','Game Object 事件被更新'],rule.trigger)}${selectField('观察内容','ruleObserve',['移动实体穿过「停止线」','主体随身物品中不存在「门禁卡」','附近 Game Object 状态','感知范围内的事件主体'],rule.observe)}${selectField('条件','ruleCondition',['phase = VEHICLE_RED','locked = true','附近对象数量 > 0','状态与上一帧不同'],rule.condition)}${selectField('参数交给谁','ruleRecipient',['触发事件的主体','感知范围内的全部事件主体'],rule.recipient)}<div class="field"><label>自然语言参数模板 <small>运行时变量</small></label><textarea class="control" id="ruleTemplate">${rule.template}</textarea><div class="variable-list"><button class="variable-chip" data-variable="{world}">{world}</button><button class="variable-chip" data-variable="{sector}">{sector}</button><button class="variable-chip" data-variable="{arena}">{arena}</button><button class="variable-chip" data-variable="{game_object}">{game_object}</button><button class="variable-chip" data-variable="{state}">{state}</button></div></div><div class="payload-preview"><div class="payload-head"><strong>运行时输出预览</strong><span>text/plain · zh-CN</span></div><div class="payload-body"><p id="payloadPreview">${resolveTemplate(rule.template,a)}</p><div class="payload-meta"><span>target: event.subject</span><span>source: ${a.id}</span></div></div></div><div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="test-button${running?' running':''}" id="testSensing">▶ ${running?'模拟感知中…':'模拟感知'}</button></div></div></article><div id="testResult">${state.testRun&&state.testRun.done?testResult(a,rule):''}</div></div>`}
    function selectField(label,id,options,value){return`<div class="field"><label>${label}</label><select class="control" id="${id}">${options.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}</select></div>`}

R.slice(i+1):[];root.innerHTML=`<div class="hud-row"><span class="hud-label">${item.name}</span><span>${item.recipe?`${item.recipe.layers.length} 层复合配方`:`真实素材 ${item.sheet}.png`}</span><span class="hud-key">${state.paintSemantic?'图形 + 本层语义':'仅图形'}</span><span class="hud-key">${state.focusHigherLevels?`聚焦 ${LEVEL_META[state.paletteLevel].label}`:'完整合成'}</span>${hidden.length?`<span>已隐藏 ${hidden.map(id=>LEVEL_META[id].label).join(' / ')}</span>`:'<span>画笔绘制 · 空格平移</span>'}</div>`}}
    function updateStatus(){const labels={visual:'素材与视觉',objects:'四层定义管理',layers:'图层',semantics:'四层语义',assets:'空间资产'};document.getElementById('canvasModeLabel').textContent=labels[state.mode];document.getElementById('interactionHint').textContent={visual:state.focusHigherLevels?`层级聚焦：${LEVEL_META[state.paletteLevel].label} 以上内容已隐藏，仅影响预览`:'四层素材完整合成预览',objects:'导入地图节点由 tilemap.json 图形配方与 maze.json 四层地址联合生成',layers:'切换图层显示、顺序与不透明度',semantics:'选择四层语义节点，或在画布上框选覆盖范围',assets:'资产感知附近对象并输出自然语言参数，不绑定 Agent'}[state.mode];let text='未选择';if(state.mode==='objects'){const o=getManagedDefinition();text=`已选：${o?o.name:LEVEL_META[state.manageLevel].label}`}else if(state.mode==='semantics'){const s=getSelectedSemantic();text=`已选：${s?s.name:'the Ville'}`}else if(state.mode==='layers'){text=`已选：${(LAYERS.find(l=>l.id===state.selectedLayerId)||LAYERS[0]).name}`}else if(state.mode==='assets'){const a=getSelectedAsset();text=`已选：${a?a.appearance.label:'空间资产'}`}else{const placed=getSelectedVisualObject(),item=getActivePaintItem();text=`已选：${placed?placed.name:item.name}`};document.getElementById('selectionStatus').textContent=text;const managed=getManagedDefinition();document.getElementById('activeContext').textContent=state.mode==='objects'?`${LEVEL_META[state.manageLevel].label} → ${managed?.recipe?'Tiled 复合配方':'基础素材'} → 地图画笔`:state.mode==='semantics'?semanticPath(getSelectedSemantic()).filter(Boolean).join(' → '):state.mode==='assets'?(getSelectedAsset()||world.spatial_scene.placements[0]).appearance.label:state.mode==='layers'?(LAYERS.find(l=>l.id===state.selectedLayerId)||LAYERS[0]).name:`${state.paletteLevel.replace('_',' ')} → ${getActivePaintItem().name}`}

    function getSelectedSemantic(){if(state.selectedSemanticId==='world-root')return{id:'world-root',level:'world',name:'the Ville',parent:null,x:0,y:0,w:MAP_WIDTH,h:MAP_HEIGHT};return SEMANTIC_REGIONS.find(s=>s.id===state.selectedSemanticId)||findSemanticByName('咖啡馆顾客座位','game_object')}
    function findSemanticByName(name,level,parent){let found=SEMANTIC_REGIONS.find(s=>s.name===name&&s.level===level&&(!parent||s.parent===parent));if(found)return found;if(level==='sector'){const r=SECTOR_RECTS.find(x=>x[0]===name);if(r)return{id:`sector-${name}`,level,name,x:r[1],y:r[2],w:r[3],h:r[4],parent:'the Ville'}}if(level==='arena'){const sector=parent||Object.keys(SEMANTIC_TREE).find(s=>Object.hasOwn(SEMANTIC_TREE[s],name));const sec=findSemanticByName(sector,'sector');return{id:`arena-${name}`,level,name,x:(sec?.x||40)+2,y:(sec?.y||20)+2,w:Math.max(4,(sec?.w||12)-4),h:Math.max(3,(sec?.h||9)-4),parent:sector}}if(level==='game_object'){let sector,arena=parent;Object.entries(SEMANTIC_TREE).some(([s,as])=>Object.entries(as).some(([a,os])=>{if(a===arena&&os.includes(name)){sector=s;return true}return false}));const ar=findSemanticByName(arena,'arena',sector);return{id:`obj-${name}`,level,name,x:(ar?.x||60)+2,y:(ar?.y||25)+2,w:4,h:2,parent:arena,sector}}return null}

    function drawRecipeWorkbench(o,levelMeta,card){state.objectPreview=null;ctx.fillStyle='rgba(255,255,255,.96)';ctx.strokeStyle='#cbd8d3';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(card.x,card.y,card.w,card.h,12);ctx.fill();ctx.stroke();ctx.fillStyle='#17232a';ctx.font='700 14px '+getComputedStyle(document.body).fontFamily;ctx.fillText(`${levelMeta.label} · ${o.category}`,card.x+22,card.y+30);ctx.fillStyle='#71807a';ctx.font='10px '+getComputedStyle(document.body).fontFamily;ctx.fillText(`${o.recipe.layers.length} 个 Tiled 图层 · ${o.recipe.tileCount} tiles · ${o.recipe.tilesets.length} 个 Tileset`,card.x+22,card.y+49);const b=o.recipe.bounds,maxW=card.w-54,maxH=card.h-112,scale=Math.min(maxW/(b.w*BASE_CELL),maxH/(b.h*BASE_CELL)),dw=b.w*BASE_CELL*scale,dh=b.h*BASE_CELL*scale,dx=card.x+(card.w-dw)/2,dy=card.y+72+(maxH-dh)/2;ctx.fillStyle='#edf3f0';ctx.fillRect(dx-8,dy-8,dw+16,dh+16);ctx.imageSmoothingEnabled=false;for(const name of o.recipe.layers){const layerCanvas=tilemapRuntime.layerCanvases.get(canonicalLayerName(name));if(layerCanvas)ctx.drawImage(layerCanvas,b.x*BASE_CELL,b.y*BASE_CELL,b.w*BASE_CELL,b.h*BASE_CELL,dx,dy,dw,dh)}ctx.strokeStyle='#16715c';ctx.lineWidth=2;ctx.strokeRect(dx-.5,dy-.5,dw+1,dh+1);ctx.fillStyle='rgba(14,93,75,.92)';ctx.fillRect(dx,Math.max(dy,dy+dh-22),Math.min(dw,310),22);ctx.fillStyle='#fff';ctx.font='700 9px '+getComputedStyle(document.body).fontFamily;ctx.fillText(`源范围 (${b.x}, ${b.y}) · ${b.w}×${b.h} · 可完整回放`,dx+7,Math.max(dy+14,dy+dh-8))}
    function drawDecorations(s){ctx.fillStyle=COLORS.tree;const trees=[[5,18],[29,8],[38,17],[50,30],[87,36],[126,39],[31,89],[99,90],[135,20],[5,51]];trees.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x*s,y*s,Math.max(1.5,s*1.2),0,Math.PI*2);ctx.fill()})}
    function drawBuildingLabels(s){if(s<3.5)return;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`700 ${Math.max(6,s*1.15)}px ${getComputedStyle(document.body).fontFamily}`;SECTOR_RECTS.forEach(([name,x,y,w,h])=>{ctx.fillStyle='rgba(48,58,54,.67)';ctx.fillText(name,(x+w/2)*s,(y+h/2)*s,Math.max(38,w*s-8))})}
    function drawSemantics(s){const showAll=state.mode==='semantics';if(!showAll)return;const selected=getSelectedSemantic();SEMANTIC_REGIONS.filter(r=>r.level==='sector').forEach(r=>drawSemanticRegion(r,s,'rgba(71,114,199,.09)',COLORS.blue,r===selected));SEMANTIC_REGIONS.filter(r=>r.level==='arena').forEach(r=>drawSemanticRegion(r,s,'rgba(233,147,56,.13)',COLORS.orange,r===selected,true));SEMANTIC_REGIONS.filter(r=>r.level==='game_object').forEach(r=>drawSemanticRegion(r,s,'rgba(128,91,166,.17)',COLORS.purple,r===selected));if(selected&&!SEMANTIC_REGIONS.includes(selected)&&selected.level!=='world')drawSemanticRegion(selected,s,selected.level==='arena'?'rgba(233,147,56,.13)':'rgba(128,91,166,.17)',selected.level==='arena'?COLORS.orange:COLORS.purple,true,selected.level==='arena');if(selected&&selected.level==='world'){ctx.strokeStyle=COLORS.teal;ctx.lineWidth=Math.max(2,s*.25);ctx.strokeRect(1,1,MAP_WIDTH*s-2,MAP_HEIGHT*s-2)}}
    function drawSemanticRegion(r,s,fill,stroke,selected,dashed=false){ctx.save();ctx.fillStyle=fill;ctx.strokeStyle=selected?'#f0a33a':stroke;ctx.lineWidth=selected?Math.max(2,s*.25):Math.max(1,s*.14);if(dashed)ctx.setLineDash([Math.max(3,s),Math.max(2,s*.65)]);ctx.fillRect(r.x*s,r.y*s,r.w*s,r.h*s);ctx.strokeRect(r.x*s+.5,r.y*s+.5,r.w*s-1,r.h*s-1);ctx.setLineDash([]);if(s>3.5){ctx.fillStyle=selected?'#7e4c12':stroke;ctx.font=`700 ${Math.max(6,s*.95)}px ${getComputedStyle(document.body).fontFamily}`;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(r.name,r.x*s+3,r.y*s+3,Math.max(40,r.w*s-6))}ctx.restore()}
    function drawAssets(s){world.spatial_scene.placements.forEach(a=>{const selected=state.selected&&state.selected.kind==='asset'&&state.selected.id===a.id,x=a.x_m*s,y=a.y_m*s;ctx.save();ctx.translate(x,y);ctx.rotate(a.rotation_deg*Math.PI/180);if(selected){ctx.fillStyle='rgba(240,163,58,.18)';ctx.strokeStyle='#f0a33a';ctx.lineWidth=Math.max(1.5,s*.18);ctx.beginPath();ctx.roundRect(-s,-s,s*2,s*2,s*.25);ctx.fill();ctx.stroke()}if(a.asset_key==='traffic-light')drawTraffic(ctx,s,a.initial_state.phase);else if(a.asset_key==='gate')drawGate(ctx,s,a.initial_state.locked);else{ctx.fillStyle='#fff';ctx.strokeStyle=COLORS.teal;ctx.lineWidth=Math.max(1,s*.1);ctx.beginPath();ctx.arc(0,0,Math.max(3,s*.58),0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=COLORS.teal;ctx.font=`${Math.max(8,s)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a.appearance.icon,0,0)}ctx.restore()})}
    function drawTraffic(c,s,phase){c.fillStyle='#23332e';c.beginPath();c.roundRect(-s*.35,-s*.65,s*.7,s*1.3,s*.16);c.fill();c.fillStyle=(phase||'').includes('RED')?'#e45850':'#663d38';c.beginPath();c.arc(0,-s*.28,Math.max(1.5,s*.16),0,Math.PI*2);c.fill();c.fillStyle=(phase||'').includes('GREEN')?'#48be70':'#354f40';c.beginPath();c.arc(0,s*.3,Math.max(1.5,s*.16),0,Math.PI*2);c.fill()}
    function drawGate(c,s,locked){c.strokeStyle='#24443a';c.lineWidth=Math.max(2,s*.15);c.beginPath();c.moveTo(-s*.7,s*.55);c.lineTo(-s*.7,-s*.55);c.moveTo(s*.7,s*.55);c.lineTo(s*.7,-s*.55);c.stroke();c.strokeStyle=locked?'#d3564e':COLORS.teal;c.beginPath();c.moveTo(-s*.58,0);c.lineTo(s*.55,0);c.stroke()}
    function drawBuilderSelection(s){const selected=currentBuilderSelection(),item=selected?.instances?(selected.representative||selected.instances[0]):selected,b=item?.recipe?.bounds;if(!b)return;ctx.save();ctx.fillStyle='rgba(18,129,105,.09)';ctx.strokeStyle='#128169';ctx.lineWidth=Math.max(2,s*.18);ctx.setLineDash([Math.max(5,s*.8),Math.max(3,s*.45)]);ctx.fillRect(b.x*s,b.y*s,b.w*s,b.h*s);ctx.strokeRect(b.x*s+1,b.y*s+1,b.w*s-2,b.h*s-2);ctx.setLineDash([]);const label=`${BUILDER_META[state.builderLevel].childLabel}: ${selected.name}`;ctx.font=`600 ${Math.max(10,Math.min(14,s*1.1))}px Inter, sans-serif`;const width=ctx.measureText(label).width+14,height=Math.max(20,s*1.8),ly=Math.max(0,b.y*s-height);ctx.fillStyle='#0d6958';ctx.fillRect(b.x*s,ly,width,height);ctx.fillStyle='#fff';ctx.fillText(label,b.x*s+7,ly+height*.7);ctx.restore()}
    function drawSelection(s){if(state.mode!=='visual'||!state.selected)return;if(state.selected.kind==='visual-object'){const p=getSelectedVisualObject();if(!p)return;ctx.fillStyle='rgba(240,163,58,.13)';ctx.strokeStyle='#f0a33a';ctx.lineWidth=Math.max(2,s*.2);ctx.fillRect(p.x*s,p.y*s,p.w*s,p.h*s);ctx.strokeRect(p.x*s+1,p.y*s+1,p.w*s-2,p.h*s-2)}else if(state.selected.kind==='cell'){ctx.strokeStyle='#f0a33a';ctx.lineWidth=Math.max(2,s*.2);ctx.strokeRect(state.selected.x*s+1,state.selected.y*s+1,s-2,s-2)}}
    function drawSensing(s){const a=getSelectedAsset();if(!a)return;const x=a.x_m*s,y=a.y_m*s,r=a.sensing.radius_m*s;ctx.save();ctx.strokeStyle='rgba(22,113,92,.75)';ctx.fillStyle='rgba(22,113,92,.08)';ctx.lineWidth=Math.max(1,s*.13);ctx.setLineDash([Math.max(3,s*.6),Math.max(2,s*.45)]);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.setLineDash([]);if(state.testRun&&!state.testRun.done){const pulse=(state.testRun.progress*2)%1;ctx.strokeStyle=`rgba(22,113,92,${1-pulse})`;ctx.lineWidth=Math.max(2,s*.25);ctx.beginPath();ctx.arc(x,y,r*pulse,0,Math.PI*2);ctx.stroke();const angle=Math.PI*(1.25+state.testRun.progress*.7),ex=x+Math.cos(angle)*r*.72,ey=y+Math.sin(angle)*r*.72;ctx.fillStyle=COLORS.orange;ctx.beginPath();ctx.moveTo(ex,ey-s*.55);ctx.lineTo(ex+s*.55,ey);ctx.lineTo(ex,ey+s*.55);ctx.lineTo(ex-s*.55,ey);ctx.closePath();ctx.fill()}ctx.restore()}
    function drawSemanticBox(s){const a=state.drag.start,b=state.drag.current,x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(a.x-b.x)+1,h=Math.abs(a.y-b.y)+1;const color=state.semanticLevel==='sector'?COLORS.blue:state.semanticLevel==='arena'?COLORS.orange:COLORS.purple;ctx.fillStyle=color+'25';ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,s*.22);ctx.setLineDash([5,4]);ctx.fillRect(x*s,y*s,w*s,h*s);ctx.strokeRect(x*s,y*s,w*s,h*s);ctx.setLineDash([])}

    function snapshot(){state.history.push(JSON.stringify({cells:world.definition.editor.cells,visualObjects:world.definition.editor.visualObjects,tiles:world.definition.tiles,placements:world.spatial_scene.placements,layers:LAYERS,semantics:SEMANTIC_REGIONS,registry:OBJECT_REGISTRY,levelLibrary:LEVEL_LIBRARY}));if(state.history.length>24)state.history.shift();state.future=[];updateHistory()}
    function currentSnapshot(){return JSON.stringify({cells:world.definition.editor.cells,visualObjects:world.definition.editor.visualObjects,tiles:world.definition.tiles,placements:world.spatial_scene.placements,layers:LAYERS,semantics:SEMANTIC_REGIONS,registry:OBJECT_REGISTRY,levelLibrary:LEVEL_LIBRARY})}
    function restore(v){const d=JSON.parse(v);world.definition.editor.cells=d.cells;world.definition.editor.visualObjects=d.visualObjects||[];world.definition.tiles=d.tiles;world.spatial_scene.placements=d.placements;LAYERS.splice(0,LAYERS.length,...d.layers);SEMANTIC_REGIONS.splice(0,SEMANTIC_REGIONS.length,...d.semantics);if(d.registry)OBJECT_REGISTRY.splice(0,OBJECT_REGISTRY.length,...d.registry);if(d.levelLibrary)Object.keys(LEVEL_LIBRARY).forEach(level=>LEVEL_LIBRARY[level].splice(0,LEVEL_LIBRARY[level].length,...d.levelLibrary[level]));Object.keys(state.selectedDefinitionIds).forEach(level=>{const list=definitionRegistry(level);if(!list.some(o=>o.id===state.selectedDefinitionIds[level]))state.selectedDefinitionIds[level]=list[0].id})}
    function undo(){if(!state.history.length)return;state.future.push(currentSnapshot());restore(state.history.pop());state.testRun=null;markDirty();renderAll();showToast('已撤销','返回上一步地图状态')}
    function redo(){if(!state.future.length)return;state.history.push(currentSnapshot());restore(state.future.pop());state.testRun=null;markDirty();renderAll();showToast('已重做','已恢复下一步地图状态')}
    function updateHistory(){document.getElementById('undoButton').disabled=!state.history.length;document.getElementById('redoButton').disabled=!state.future.length}
    function markDirty(render=true){state.dirty=true;updateSaveState();updateHistory();if(render)updateStatus()}function updateSaveState(){document.getElementById('saveState').textContent=state.dirty?'有未保存更改':'所有更改已保存'}
    function keyDown(e){if(e.target.matches('input,select,textarea'))return;if(e.code==='Space'){e.preventDefault();state.spaceDown=true}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}}
    function showToast(title,copy){const t=document.getElementById('toast');document.getElementById('toastTitle').textContent=title;document.getElementById('toastCopy').textContent=copy;clearTimeout(toastTimer);t.classList.remove('show');requestAnimationFrame(()=>t.classList.add('show'));toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
    function clamp(v,min,max){return Math.max(min,Math.min(max,v))}function escapeHtml(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function init(){renderAll();bind();updateHistory();resizeCanvas();new ResizeObserver(resizeCanvas).observe(host);loadTilemapAssets();requestAnimationFrame(()=>{fitMap();showToast('斯坦福小镇地图正在载入','正在用现有 spritesheet 合成真实地图图形')})}
