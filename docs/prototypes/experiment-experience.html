<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Foundry · 实验体验原型</title>
<style>
:root{--ink:#17232a;--muted:#6a7a82;--bg:#f4f7f6;--line:#dfe7e4;--green:#127c68;--soft:#e3f3ef;--nav:#12201f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Inter,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:9px 15px;transition:.18s}button:hover{border-color:var(--green);background:#eff8f5}button:focus-visible,a:focus-visible{outline:3px solid #9ccf4a;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#0f6e5d;color:white}.danger{color:#ba4444}.muted,small{color:var(--muted)}small{font-size:12px}h1{font-size:25px;margin:0 0 8px}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;margin:0 0 8px}p{margin:7px 0 16px}aside{position:fixed;width:216px;inset:0 auto 0 0;background:var(--nav);color:#c5d6cf;padding:22px 14px;display:flex;flex-direction:column}.brand{font-size:17px;font-weight:700;color:white;padding:0 10px 28px}.brand small{display:block;font-size:9px;letter-spacing:2px;color:#90a9a0}aside label{font-size:11px;letter-spacing:1px;color:#7f9a91;padding:20px 12px 8px}aside button{text-align:left;background:none;border:0;color:#c5d6cf;width:100%;margin:3px 0;padding:11px 13px}aside button.active{background:#244139;color:#dff4eb}aside button:hover{background:#203a32;color:white}.sidefoot{margin-top:auto;border-top:1px solid #2b413a;padding:20px 10px 0;font-size:12px;color:#9bb3a9}main{margin-left:216px}header{height:68px;background:#fff;border-bottom:1px solid var(--line);padding:0 32px;display:flex;align-items:center;justify-content:space-between}.badge{font-size:12px;border-radius:5px;background:var(--soft);color:var(--green);padding:4px 9px;display:inline-block}.badge.gray{background:#edf0ef;color:#63736b}.badge.amber{background:#fff4de;color:#9c661a}.badge.red{background:#fff0ef;color:#b44444}.content{max-width:1500px;margin:auto;padding:28px 32px 50px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.stack{display:grid;gap:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:23px;box-shadow:0 2px 5px #12201f03}.notice{background:#eaf3ef;border:1px solid #d4e5dd;padding:12px 16px;border-radius:8px;color:#476359;margin:20px 0}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:24px}.tabs button{border:0;border-radius:0;background:none;padding:13px 0;color:var(--muted)}.tabs button.active{border-bottom:2px solid var(--green);color:var(--green);font-weight:600}.icon{width:36px;height:36px;background:var(--soft);display:grid;place-items:center;border-radius:10px;color:var(--green);font-size:18px}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.cardhead h2{margin:0}.map{position:relative;overflow:hidden;border-radius:9px;background:#e3eadb}.map img{display:block;width:100%;height:100%;object-fit:contain}.map.preview{height:220px}.map.large{height:450px}.pin{position:absolute;width:29px;height:29px;border:3px solid white;border-radius:50%;background:var(--green);color:white;box-shadow:0 2px 9px #0005;padding:0;font-size:11px}.pin:hover{background:#183f37;color:white;transform:scale(1.15)}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{border:1px solid var(--line);border-radius:9px;padding:14px;text-align:left;display:flex;gap:11px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#edf2ff;color:#49629b;flex-shrink:0}.person:nth-child(2) .avatar{background:#fff1da;color:#a17435}.person:nth-child(3) .avatar{background:#e7efe1;color:#5a7548}.person:nth-child(4) .avatar{background:#f3e9f3;color:#956b94}.person small{display:block}.meta{display:flex;gap:26px;padding:14px 0}.meta b{display:block;font-size:19px;font-weight:600}.meta small{display:block}.footerbar{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding:18px 22px;background:white;border:1px solid var(--line);border-radius:10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips span{background:#f1f5f3;border:1px solid #e4eae7;padding:4px 9px;border-radius:5px;font-size:12px}.runlayout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(290px,1fr);gap:20px}.progress{height:6px;background:#e8eeeb;border-radius:5px;margin:16px 0}.progress i{height:100%;display:block;background:var(--green);border-radius:5px}.statusdot{width:8px;height:8px;background:var(--green);border-radius:100%;display:inline-block;margin-right:8px}.feed{padding:14px 0;border-bottom:1px solid var(--line)}.feed:last-child{border:0}.feed small{display:block}.chain{border-left:2px solid #d5e6df;margin:20px 0 10px 8px;padding-left:24px}.chain article{position:relative;margin:0 0 25px}.chain article:before{content:'';position:absolute;left:-31px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid white}.chain p{color:#52665c;margin:5px 0}.fact{padding:12px;background:#f4f7f6;border-radius:7px}.evidence{display:grid;grid-template-columns:230px 1fr;gap:20px}.roster button{display:block;width:100%;text-align:left;margin-bottom:9px}.roster button.selected{border-color:var(--green);background:var(--soft)}details{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f6;padding:14px;border-radius:6px;font:12px/1.8 Consolas,monospace}textarea,input,select{border:1px solid var(--line);border-radius:7px;padding:10px;background:white;color:var(--ink);width:100%}textarea{resize:vertical;line-height:1.9}label.field{display:block;color:var(--muted);margin:15px 0 6px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select{width:auto}.overlay{position:fixed;inset:0;background:#10271d66;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px)}.dialog{background:white;border-radius:14px;width:620px;max-height:90vh;overflow:auto;padding:26px;box-shadow:0 24px 60px #12201f30}.dialog.wide{width:920px}.dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:25px;border-top:1px solid var(--line);padding-top:20px}.check{padding:12px 0;border-bottom:1px solid var(--line)}.check b{color:var(--green);margin-right:12px}.toast{position:fixed;bottom:25px;right:28px;background:#173b30;color:white;padding:14px 23px;border-radius:10px;z-index:30;box-shadow:0 4px 24px #0002}.designbar{background:#fffaed;border-bottom:1px solid #ede4c9;padding:8px 32px;font-size:12px;display:flex;justify-content:space-between;gap:15px;color:#83683d}.link{padding:0;border:0;background:none;color:var(--green)}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:15px 10px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:12px;color:var(--muted);font-weight:500}.empty{text-align:center;padding:60px 20px}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.callout{border-left:3px solid var(--green);padding:8px 15px;background:#f0f7f4;margin:15px 0}.text-button{border:0;background:none;padding:4px;color:var(--green)}@media(max-width:1050px){aside{width:176px}main{margin-left:176px}.content{padding:22px}.runlayout{grid-template-columns:1fr}.map.large{height:360px}}@media(max-width:720px){aside{position:static;width:auto;padding:12px;display:block}aside .brand{padding:0}aside label,aside .sidefoot{display:none}aside nav{display:flex;overflow:auto}aside button{white-space:nowrap}main{margin:0}header{padding:12px;height:auto}.grid,.split,.evidence{grid-template-columns:1fr}.content{padding:16px}.designbar{padding:8px 16px}.people{grid-template-columns:1fr 1fr}.row.between{flex-wrap:wrap}.dialog{padding:20px}.map.large{height:300px}}[hidden]{display:none!important}
</style></head><body>
<aside><div class="brand">◈ Agent Foundry<small>RESEARCH CONSOLE</small></div><label>当前实验</label><nav id="nav"><button data-page="setup">◫　实验工作台</button><button data-page="run">▷　运行与回放</button><button data-page="evidence">◎　角色与行为</button><button data-page="history">▤　仿真记录</button></nav><label>作者工作区</label><button onclick="resource()">▧　资源库 <small>　地图 · 角色 · 技能</small></button><div class="sidefoot">● 本地工作区<br><small>所有运行内容来自实验自己的副本</small></div></aside>
<main><div class="designbar"><span>交互设计原型 · 演示数据 · 不连接真实实验</span><button class="link" onclick="guide()">体验路线 / 设计说明 ↗</button></div><header><div class="row"><b>溪谷大学四人两日生活</b><span id="lifecycle" class="badge gray">草稿</span></div><button onclick="copyExperiment()">复制实验并调整</button></header><div class="content" id="app"></div></main><div id="overlay" hidden></div><div id="toast" class="toast" hidden role="status"></div>
<script>
const map='../images/creek-university-v2/map/creek-university-l4-game-object-4480x3200.jpg';
const names=['陈明远','林晨','王建国','赵悦'],roles=['教师 · 48 岁','学生 · 21 岁','维修员 · 42 岁','学生 · 20 岁'];
let page='setup',sealed=false,state='running',step=38,selected=0,viewStep=38,records=true,playing=false,timer,previousFocus;
let sop='每一轮先看看周围发生了什么，结合当前时间、自己的生活计划和上一轮收到的反馈，决定眼下值得做的事。\n\n需要以前的信息时，查找自己的记忆；遇到值得记住的新情况，就把它记下来。需要交谈或整理经历时，可以调用对应的子技能，由你决定何时调用。\n\n要去别处时先查询路线。吃饭、休息、学习和工作使用普通活动；只有确实在等人或等事情时才等待，并说明等待到什么时候。\n\n每轮最多提交一次世界动作。动作被接受后结束本轮；不要自行推进世界时间。';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500)}
function modal(title,body,foot='',wide=false){previousFocus=document.activeElement;$('#overlay').hidden=false;$('#overlay').className='overlay';$('#overlay').innerHTML=`<section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${title}"><div class="row between"><h2>${title}</h2><button aria-label="关闭" onclick="closeModal()">×</button></div>${body}<footer>${foot||'<button onclick="closeModal()">知道了</button>'}</footer></section>`;$('#overlay button').focus()}
function closeModal(){$('#overlay').hidden=true;previousFocus?.focus()}
document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const a=[...$('#overlay').querySelectorAll('button,input,textarea,select,summary')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
function goto(p){page=p;render();window.scrollTo(0,0)}$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b)goto(b.dataset.page)};
function people(){return names.map((n,i)=>`<button class="person" onclick="person(${i})"><span class="avatar">${n.slice(0,1)}</span><span><b>${n}</b><small>${roles[i]}</small></span></button>`).join('')}
function mapView(big=false){return `<div class="map ${big?'large':'preview'}"><img src="${map}" alt="溪谷大学校园地图">${big?names.map((n,i)=>`<button aria-label="查看${n}的行为" class="pin" style="left:${[27,43,74,56][i]}%;top:${[44,29,43,31][i]}%" onclick="selected=${i};goto('evidence')">${n[0]}</button>`).join(''):''}</div>`}
function render(){$('#lifecycle').textContent=sealed?'已封存 · 配置固定':'草稿';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#app').innerHTML=({setup,run,evidence,history}[page])()}
function setup(){return `<div class="row between"><div><h1>让四个人，在校园里生活两天</h1><p class="muted">从场景、角色和行为方式开始。准备好后，一次启动。</p></div><span class="badge">✓ 4 项配置已齐全</span></div><div class="notice">${sealed?'本实验已封存。当前运行使用这里的完整配置；需要调整时，复制为一个新的实验。':'这里编辑的是本实验的独立副本。资源库后续修改，不会改变本实验。'}</div><div class="grid"><section class="card"><div class="cardhead"><div class="row"><span class="icon">▧</span><h2>场景</h2></div><button onclick="mapEditor()">${sealed?'查看场景':'检查场景'} ↗</button></div>${mapView()}<div class="row between" style="margin-top:14px"><b>溪谷大学</b><span class="badge">通路检查通过</span></div><small>4 个区域 · 11 个场所 · 48 个物品</small></section><section class="card"><div class="cardhead"><div class="row"><span class="icon">◎</span><h2>参与角色</h2></div><span class="badge gray">4 人</span></div><div class="people">${people()}</div><div class="callout">每个人拥有自己的初始计划和私人记忆。点击角色查看实验中的具体配置。</div><small>初始位置已检查 · 均位于可行走的空间</small></section><section class="card"><div class="cardhead"><div class="row"><span class="icon">⌬</span><h2>行为方式</h2></div><button onclick="skill()">${sealed?'查看':'编辑'}行为说明 ↗</button></div><b>根据情境安排生活</b><p class="muted">先观察，按需回忆，再结合计划做出决定。交谈和反思由 Brain 自行选择时机。</p><div class="chips"><span>观察周围</span><span>回忆与记录</span><span>查询路线</span><span>执行动作</span></div><small>可调用子技能：日常交谈、整理经历</small></section><section class="card"><div class="cardhead"><div class="row"><span class="icon">◷</span><h2>时间与模型</h2></div><button onclick="settings()">${sealed?'查看':'调整'} ↗</button></div><div class="meta"><div><b>2 天</b><small>2026/09/07 06:00 起</small></div><div><b>5 分钟</b><small>每步 · 共 576 步</small></div></div><div class="row between"><span>Qwen3.8 · 27B<br><small>本地模型 · 实际速度将在运行后校准</small></span><span class="badge">连接正常</span></div></section></div><div class="footerbar"><span>✓ 场景、角色、行为和模型已配置<br><small>开始前会检查本次实验使用的完整内容。</small></span><button class="primary" onclick="preflight()">${sealed?'再执行一次':'检查并开始'} →</button></div>`}
function preflight(){modal('准备开始这次仿真',`<p class="muted">从初始状态开始一段新的两日校园生活。</p><div class="meta"><div><b>4 人</b><small>独立角色</small></div><div><b>576 步</b><small>两天虚拟时间</small></div><div><b>本地 Qwen</b><small>使用已保存的模型配置</small></div></div>${['地图、入口和初始位置有效','Brain 与全部子技能已包含在实验中','模型连接正常，记忆服务可用'].map(x=>`<div class="check"><b>✓</b>${x}</div>`).join('')}<div class="notice">演示预检：0 个阻断 · 0 个警告<br><small>预计约 18 小时，运行后依据实际速度更新。此数字仅用于展示设计。</small></div><p>确认后固定本实验配置，并创建新的仿真记录。</p>`,`<button onclick="closeModal()">返回检查</button><button class="primary" onclick="start()">确认开始仿真</button>`)}
function start(){sealed=true;records=true;state='running';step=1;viewStep=1;closeModal();goto('run');toast('新仿真已开始 · 正在执行第 1 步')}
function run(){let status={running:'正在执行',paused:'已暂停',failed:'需要处理',completed:'执行完成',cancelled:'已取消'}[state];return `<div class="row between"><div><h1>运行与回放</h1><p class="muted">仿真 01 · 本实验的独立运行记录</p></div><div class="toolbar"><button onclick="demo()">切换演示状态</button>${state==='running'?'<button onclick="pause()">Ⅱ 暂停</button>':state==='paused'?'<button class="primary" onclick="pause()">▷ 继续</button>':''}${['running','paused'].includes(state)?'<button class="danger" onclick="cancelRun()">取消仿真</button>':''}</div></div><section class="card"><div class="row between"><div><span class="badge ${state==='failed'?'red':''}">${status}</span>　<b>第 ${step} / 576 步</b></div><span class="muted">虚拟时间 · 09/07 ${virtual(step)} 北京时间</span></div><div class="progress"><i style="width:${step/576*100}%"></i></div><div class="row between"><span>${state==='running'?'<span class="statusdot"></span>林晨正在调用本地模型 · 已等待 12 秒':state==='paused'?'已在完整步骤边界暂停，已提交的事实已保存。':state==='failed'?'写入运行文件失败。已完成的步骤仍可查看。':state==='completed'?'576 步已执行完成，结果报告已生成。':'本次仿真已取消，已完成的记录仍可查看。'}</span><small>${state==='running'?'最近提交：18 秒前 · 剩余时间约 17 小时':''}</small></div>${state==='failed'?'<div class="notice">无法写入回放投影文件。请确认文件未被其他程序占用。<div class="toolbar" style="margin-top:10px"><button onclick="diagnostic()">查看诊断与处理建议</button><button onclick="preflight()">从头新跑一次</button></div></div>':''}${state==='completed'?'<div class="notice">执行完成 ≠ 实验结论。发现 2 条行为质量提醒，可逐条查看证据。<button class="text-button" onclick="goto(\'evidence\')">查看行为质量 →</button></div>':''}</section><div class="runlayout" style="margin-top:20px"><section class="card"><div class="cardhead"><h2>校园现场</h2><span class="badge gray">已提交事实 · 第 ${viewStep} 步</span></div>${mapView(true)}<div class="row" style="margin-top:16px"><button aria-label="上一帧" onclick="seek(-1)">‹</button><button onclick="play()">${playing?'Ⅱ':'▷'} 回放</button><input aria-label="回放步骤" type="range" min="1" max="${step}" value="${viewStep}" oninput="viewStep=+this.value;render()"><button aria-label="下一帧" onclick="seek(1)">›</button><small style="white-space:nowrap">${viewStep} / ${step}</small></div><small>回放演示：切换步骤查看时间标记；角色坐标为静态示例。</small></section><section class="card"><div class="cardhead"><h2>角色最近在做什么</h2><span class="badge gray">4 人</span></div>${names.map((n,i)=>`<div class="feed"><div class="row between"><b>${n}</b><button class="text-button" onclick="selected=${i};goto('evidence')">查看原因 ↗</button></div><p>${['前往教学楼，沿校园道路移动','在宿舍门口，准备去上课','前往维修站，准备巡检工具','离开宿舍，准备与同学见面'][i]}</p><small>动作已提交 · ${virtual(viewStep)} · 第 ${viewStep} 步</small></div>`).join('')}<details><summary>运行技术详情</summary><p>逻辑调用 152 · 物理尝试 153 · 重试 1 次</p><small>这些是演示统计。真实页面应来自当前 Run 的运行事实。</small></details></section></div>`}
function virtual(n){let m=360+(n-1)*5;return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function seek(d){viewStep=Math.max(1,Math.min(step,viewStep+d));render()}
function play(){playing=!playing;clearInterval(timer);if(playing)timer=setInterval(()=>{if(viewStep>=step){playing=false;clearInterval(timer)}else viewStep++;if(page==='run')render()},900);render()}
function pause(){state=state==='running'?'paused':'running';render();toast(state==='paused'?'已暂停 · 可以稍后继续':'正在继续仿真')}
function cancelRun(){modal('取消这次仿真？','<p>停止后续执行，保留已完成步骤、角色记忆和诊断记录。</p>','<button onclick="closeModal()">继续运行</button><button class="danger" onclick="state=\'cancelled\';closeModal();render();toast(\'仿真已取消\')">确认取消</button>')}
function evidence(){let n=names[selected];return `<div class="row between"><div><h1>理解一次行为</h1><p class="muted">从实际观察和调用记录，追溯最终提交的动作。</p></div><button onclick="goto('run')">返回校园现场</button></div><div class="evidence"><section class="card roster"><h2>选择角色</h2>${names.map((x,i)=>`<button class="${i===selected?'selected':''}" onclick="selected=${i};render()">${x}<br><small>${roles[i]}</small></button>`).join('')}<div class="notice">只展示所选角色的私人记忆。</div></section><section class="card"><div class="row between"><div class="row"><span class="avatar">${n[0]}</span><h2 style="margin:0">${n}</h2></div><div class="toolbar"><button onclick="viewStep=Math.max(1,viewStep-1);render()">‹</button><span>第 ${viewStep} 步 · ${virtual(viewStep)}</span><button onclick="viewStep=Math.min(step,viewStep+1);render()">›</button></div></div><div class="chain"><article><h3>看到了什么</h3><p>当前位置：溪谷大学 / 校园道路区。附近道路可通行，没有处于视野内的其他角色。</p><small>来源：观察周围 · 已成功返回</small></article><article><h3>想起了什么</h3><div class="fact">“今天上午有既定安排，要提前出发，为路上留出时间。”</div><p>检索到本人已保存的有效计划记忆。</p><small>来源：记忆检索 · 仅 ${n} 可见 · 演示内容</small></article><article><h3>留下了什么决策记录</h3><p>此次示例未留存模型中间文本，无法展示完整决策说明。</p><small>不根据最终动作倒推或补写模型想法。</small></article><article><h3>实际执行了什么</h3><p>查询路线后，提交一次移动动作。系统已接受，未发生重复提交。</p><span class="badge">MOVE · 已提交</span><details><summary>展开工具调用与事实</summary><pre>world-navigate → 可达（只读查询）\nworld-act → accepted: true\nEvent: ${n} / 移动到 / 校园道路区\nstructured_payload: { "from": [36,43], "to": [37,43] }\n以上为交互演示数据。</pre></details></article><article><h3>世界发生了什么变化</h3><p>位置从 [36,43] 变为 [37,43]。回放读取本步已提交事实。</p><button onclick="goto('run')">在地图上查看 ↗</button></article></div><details><summary>行为质量提醒 · 2 条示例</summary><div class="feed"><b>移动耗时可能影响原定日程</b><p>连续多步仅移动一格。需结合模型提交的目标和路径结果判断原因。</p></div><div class="feed"><b>休息被表达为等待</b><p>可以检查 Brain 对普通活动与真实等待的说明，不改变运行完成状态。</p><button onclick="skill()">查看本实验行为说明</button></div></details></section></div>`}
function history(){return `<div class="row between"><div><h1>仿真记录</h1><p class="muted">每次执行都有独立的记录。删除不会影响实验配置。</p></div><button class="primary" onclick="preflight()">新跑一次</button></div><section class="card">${records?`<table class="table"><thead><tr><th>仿真</th><th>执行状态</th><th>行为质量</th><th>进度</th><th>操作</th></tr></thead><tbody><tr><td><b>仿真 01</b><br><small>今天 14:37 · 演示</small></td><td><span class="badge">${{running:'运行中',paused:'已暂停',failed:'失败',completed:'已完成',cancelled:'已取消'}[state]}</span></td><td>2 条待查看提醒</td><td>${step} / 576</td><td><button onclick="goto('run')">打开</button> <button class="danger" onclick="removeRun()">删除</button></td></tr></tbody></table>`:'<div class="empty"><span class="icon" style="margin:auto">▤</span><h2 style="margin-top:16px">还没有仿真记录</h2><p class="muted">实验配置已保留，可以随时开始新的仿真。</p><button class="primary" onclick="preflight()">开始仿真</button></div>'}</section>`}
function removeRun(){if(['running','paused'].includes(state)){modal('请先结束这次仿真','<p>这次仿真仍在运行或暂停中。先取消执行，再删除记录。</p>','<button onclick="closeModal()">返回</button><button onclick="closeModal();goto(\'run\')">前往运行页面</button>');return}modal('删除仿真 01？','<p>运行记录和关联文件将移入可恢复回收站。实验配置和资源库内容会保留。</p>','<button onclick="closeModal()">保留</button><button class="danger" onclick="records=false;closeModal();render();toast(\'已删除仿真 01 · 文件已移入可恢复回收站\')">确认删除</button>')}
function skill(){modal('行为说明 · 本实验副本',`<div class="split"><div><label class="field">Brain：根据情境安排生活</label><textarea id="sop" rows="13" ${sealed?'readonly':''}>${esc(sop)}</textarea><small>${sealed?'已封存，只读。复制实验后可修改。':'用自然语言描述流程。没有额外的流程编排要求。'}</small></div><div><h3>可用能力</h3>${[['观察周围','了解附近人物、物品与事件'],['回忆与记录','读取、写入自己的记忆'],['查询路线','判断目标可达性，不会移动'],['执行动作','移动、活动、说话或交互']].map(x=>`<div class="feed"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}<h3 style="margin-top:18px">可调用的子技能</h3><div class="chips"><span>日常交谈</span><span>整理经历</span></div><details><summary>查看 MCP 名称</summary><small>world-perceive · world-navigate · world-act · memory-stream-*</small></details></div></div>`,`<button onclick="closeModal()">关闭</button>${sealed?'':'<button class="primary" onclick="sop=$(\'#sop\').value;closeModal();toast(\'行为说明已保存到演示草稿\')">保存行为说明</button>'}`,true)}
function person(i){modal(names[i]+' · 本实验角色',`<div class="row"><span class="avatar">${names[i][0]}</span><b>${roles[i]}</b><span class="badge gray">私人记忆独立</span></div><label class="field">初始生活计划</label><textarea rows="6" ${sealed?'readonly':''}>06:30 起床，整理自己。\n07:00 吃早餐。\n08:00 出发，按自己的职责开始上午活动。\n12:00 在食堂吃午饭。\n下午与遇见的人自然交流，完成当天安排。\n晚上回宿舍休息。</textarea><div class="notice">本面板为计划编辑的交互示例，不是正在运行的真实角色配置。</div><label class="field">初始位置</label><input value="${['教师宿舍 / 床边休息位','学生宿舍 A / 床边休息位','维修员宿舍 / 床边休息位','学生宿舍 B / 床边休息位'][i]}" readonly>`,`<button onclick="closeModal()">关闭</button>${sealed?'':'<button class="primary" onclick="closeModal();toast(\'演示：已保存角色配置\')">保存角色</button>'}`)}
function mapEditor(){modal('场景检查 · 溪谷大学',`<div class="split"><div>${mapView()}<div class="toolbar" style="margin-top:15px"><span class="badge">✓ 出入口可通行</span><span class="badge">✓ 初始位置有效</span></div></div><div><h3>选中：校园道路区 / 人行横道</h3><label class="field">这里是什么地方</label><p>连接居住区和教学区的人行通路。</p><label class="field">通行</label><p>可步行通过 · 入口已连通</p><label class="field">图片中的红绿灯</label><span class="badge amber">仅为画面内容</span><p class="muted">尚未定义灯色状态，角色不能从图片获取实时灯色。</p><small>需要信号反馈时，应建立可感知的 Game Object 并配置状态和被动响应。</small></div></div>`,null,true)}
function settings(){modal('时间与模型',`<label class="field">虚拟世界开始时间</label><input type="datetime-local" value="2026-09-07T06:00" ${sealed?'disabled':''}><div class="grid"><div><label class="field">每步分钟数</label><input type="number" value="5" min="1" ${sealed?'disabled':''}></div><div><label class="field">运行步数</label><input type="number" value="576" min="1" ${sealed?'disabled':''}></div></div><label class="field">模型</label><input value="Qwen3.8-27B · 本地已保存配置" readonly><details><summary>高级设置</summary><p>北京时间 · 随机种子 20260907<br>每 12 步保存检查点 · 保留 2 份</p></details><small>这里展示参数编辑方式；本原型的模拟运行固定为 576 步。</small>`,`<button onclick="closeModal()">关闭</button>`)}
function copyExperiment(){sealed=false;goto('setup');toast('已进入独立草稿的演示视图 · 原运行不受影响')}
function demo(){modal('切换演示状态','<p class="muted">用于评审不同状态的交互。不会操作真实服务。</p><div class="stack">'+[['running','正常运行 · 第 38 步'],['paused','暂停后可继续'],['failed','文件写入失败'],['completed','完成并查看质量报告'],['cancelled','已取消，可删除']].map(([s,t])=>`<button onclick="state='${s}';step=${s==='completed'?576:38};viewStep=step;closeModal();render()">${t}</button>`).join('')+'</div>')}
function diagnostic(){modal('写入运行文件失败','<span class="badge red">文件访问错误 · 演示</span><p>运行未能更新回放投影文件，已停止继续执行。</p><div class="callout"><b>你可以这样处理</b><p>检查文件是否被其他程序占用。若需要开发人员协助，复制下面的诊断信息。</p></div><textarea rows="5" readonly>实验：溪谷大学四人两日生活\n仿真：演示 01 · 第 38 步\n操作：写入 projection.json\n错误：WinError 5 / 文件访问被拒绝\n说明：这是原型示例，不是真实运行诊断。</textarea><small>恢复按钮仅应在系统确认具备安全恢复条件后出现。</small>','<button onclick="closeModal()">关闭</button><button class="primary" onclick="const t=$(\'.dialog textarea\');t.select();document.execCommand(\'copy\')?toast(\'诊断信息已复制\'):toast(\'请按 Ctrl+C 复制已选中的诊断信息\')">复制诊断信息</button>')}
function resource(){modal('资源库与实验的关系','<div class="chain"><article><h3>资源库：可反复使用的作者资源</h3><p>地图、角色、大脑、技能和模型按稳定身份直接编辑。</p></article><article><h3>选入实验：一次性复制</h3><p>实验得到全部必需内容，之后与资源库独立。</p></article><article><h3>开始运行：使用已封存配置</h3><p>本次运行持有完整内容，后续修改不会改变它。</p></article></div>')}
function guide(){modal('建议这样体验',`<ol><li>在实验工作台打开场景、角色和行为说明。</li><li>点击“检查并开始”，确认后进入运行页面。</li><li>点击地图上的角色，查看观察、记忆和动作证据。</li><li>回到运行页，体验暂停与继续。</li><li>用“切换演示状态”查看失败、完成和取消状态。</li><li>进入仿真记录，删除已结束记录，体验空状态。</li></ol><div class="notice">这是一份重构讨论原型。地图沿用实验素材，配色沿用现有管理台；运行、计划、统计和预检均为演示数据。</div><p class="muted">实现边界：自然语言 Brain 决定流程；状态和回放来自真实提交事实；公共资源与实验独立；运行完成与行为质量分别展示。</p>`)}
render();
</script></body></html>
