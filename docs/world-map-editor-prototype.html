html &gt; body {

    --background,

}

b,

}

.card {

  corner-shape: superellipse(1.5);

  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;

.tooltip {

  top: 0;
  left: 0;

    calc(100vw - 10px)

  background: var(--popover);

  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));

  flex-direction: column;
  gap: 2px;

.text-muted {

.form-switch .form-check-input:disabled,

      &lt;label class=&quot;af-field&quot;&gt;&lt;span&gt;图块图片&lt;/span&gt;&lt;span class=&quot;af-file-drop&quot;&gt;&lt;input type=&quot;file&quot; id=&quot;af-tile-file&quot; accept=&quot;image/png,image/jpeg,image/webp&quot;&gt; PNG / JPG / WebP，建议 32 × 32&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;af-field&quot;&gt;&lt;span&gt;无图片时的预览色&lt;/span&gt;&lt;input type=&quot;color&quot; id=&quot;af-tile-color&quot; value=&quot;#b84f55&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;af-field&quot;&gt;&lt;span&gt;通行属性&lt;/span&gt;&lt;select id=&quot;af-tile-passable&quot;&gt;&lt;option value=&quot;yes&quot;&gt;可通行&lt;/option&gt;&lt;option value=&quot;no&quot;&gt;不可通行（写入碰撞层）&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
      &lt;div class=&quot;af-modal-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;af-button&quot; id=&quot;af-tile-cancel&quot;&gt;取消&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;af-button af-button-primary&quot; id=&quot;af-tile-create&quot;&gt;创建并选中&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;af-toast&quot; id=&quot;af-toast&quot; role=&quot;status&quot; hidden&gt;地图草稿已自动保存&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;af-map-editor&#x27;);
      const primaryCanvas = root.querySelector(&#x27;#af-map-canvas&#x27;);
      const mirrorCanvases = [...root.querySelectorAll(&#x27;.af-mirror-canvas&#x27;)];
      const width = 48, height = 32;
      const tileNames = { grass:&#x27;草地&#x27;, path:&#x27;道路&#x27;, water:&#x27;水面&#x27;, floor:&#x27;木地板&#x27;, wall:&#x27;墙体&#x27;, tree:&#x27;树木&#x27; };
      const tileIds = { grass:&#x27;#0101&#x27;, path:&#x27;#0412&#x27;, water:&#x27;#0230&#x27;, floor:&#x27;#0831&#x27;, wall:&#x27;#0902&#x27;, tree:&#x27;#0618&#x27; };
      const customTileDefs = {};
      let tiles = Array.from({length: height}, () =&gt; Array(width).fill(&#x27;grass&#x27;));
      let currentTile = &#x27;grass&#x27;, currentTool = &#x27;paint&#x27;, activeTab = &#x27;paint&#x27;, editContext = &#x27;public&#x27;, selected = {x:12,y:9};
      let painting = false, zoom = 100, undoStack = [], redoStack = [], saveTimer = null;
      let selectedAgent = 0;
      let panX = 0, panY = 0, panning = false, spaceHeld = false, panStart = null;
      let currentSemantic = &#x27;sector&#x27;, semanticDrawing = false, semanticStart = null, semanticPreview = null, semanticCounter = 5;
      const publicSemanticRegions = [
        {id:&#x27;business&#x27;,type:&#x27;sector&#x27;,x:2,y:1,w:11,h:8,label:&#x27;商业区&#x27;},
        {id:&#x27;culture&#x27;,type:&#x27;sector&#x27;,x:15,y:1,w:12,h:8,label:&#x27;公共文化区&#x27;},
        {id:&#x27;residential&#x27;,type:&#x27;sector&#x27;,x:2,y:11,w:11,h:6,label:&#x27;居住区&#x27;},
        {id:&#x27;east-park&#x27;,type:&#x27;sector&#x27;,x:15,y:11,w:12,h:6,label:&#x27;东侧公园&#x27;},
        {id:&#x27;market&#x27;,type:&#x27;sector&#x27;,x:29,y:1,w:16,h:11,label:&#x27;北部集市&#x27;},
        {id:&#x27;lake-side&#x27;,type:&#x27;sector&#x27;,x:28,y:14,w:18,h:15,label:&#x27;湖畔社区&#x27;},
        {id:&#x27;cafe&#x27;,type:&#x27;arena&#x27;,x:4,y:3,w:5,h:4,label:&#x27;咖啡馆&#x27;},
        {id:&#x27;library&#x27;,type:&#x27;arena&#x27;,x:19,y:3,w:6,h:4,label:&#x27;图书馆&#x27;}
      ];
      const experimentSemanticRegions = publicSemanticRegions.map(region=&gt;({...region}));
      let semanticRegions = publicSemanticRegions;
      const agents = [
        {name:&#x27;乔治&#x27;, x:6, y:5, color:&#x27;#355fbb&#x27;},
        {name:&#x27;亚当&#x27;, x:20, y:5, color:&#x27;#b86838&#x27;},
        {name:&#x27;玛丽亚&#x27;, x:19, y:14, color:&#x27;#8a55a8&#x27;}
      ];

      function seedMap() {
        for (let y=0;y&lt;height;y++) { tiles[y][0]=&#x27;water&#x27;; tiles[y][1]=&#x27;water&#x27;; }
        for (let y=0;y&lt;height;y++) for (let x=12;x&lt;=14;x++) tiles[y][x]=&#x27;path&#x27;;
        for (let y=8;y&lt;=10;y++) for (let x=2;x&lt;width;x++) tiles[y][x]=&#x27;path&#x27;;
        for (let y=0;y&lt;height;y++) for (let x=27;x&lt;=28;x++) tiles[y][x]=&#x27;path&#x27;;
        for (let y=22;y&lt;=23;y++) for (let x=2;x&lt;width;x++) tiles[y][x]=&#x27;path&#x27;;
        building(3,3,9,7); building(18,2,25,7); building(3,12,10,16); building(32,3,40,9); building(33,15,43,21); building(5,25,13,30);
        for (let y=12;y&lt;=16;y++) for (let x=18;x&lt;=25;x++) if ((x+y)%3===0) tiles[y][x]=&#x27;tree&#x27;;
        for (let y=24;y&lt;height;y++) for (let x=31;x&lt;width;x++) if ((x+y)%4===0) tiles[y][x]=&#x27;tree&#x27;;
        for (let y=0;y&lt;height;y++) if (y%3===1) tiles[y][2]=&#x27;tree&#x27;;
      }
      function building(x1,y1,x2,y2) {
        for (let y=y1;y&lt;=y2;y++) for (let x=x1;x&lt;=x2;x++) tiles[y][x]=(x===x1||x===x2||y===y1||y===y2)?&#x27;wall&#x27;:&#x27;floor&#x27;;
        tiles[y2][Math.floor((x1+x2)/2)]=&#x27;path&#x27;;
      }
      seedMap();
      const publicTiles = tiles;
      const experimentTiles = tiles.map(row=&gt;row.slice());

      function colors() {
        return { grass:&#x27;#78a96b&#x27;, grass2:&#x27;#6e9d62&#x27;, path:&#x27;#c9b07b&#x27;, path2:&#x27;#bba16d&#x27;, water:&#x27;#5ca6c2&#x27;, water2:&#x27;#70b6cf&#x27;, floor:&#x27;#c58f58&#x27;, floor2:&#x27;#d3a06b&#x27;, wall:&#x27;#725f51&#x27;, wall2:&#x27;#8a7462&#x27;, tree:&#x27;#3f7a50&#x27;, grid:&#x27;rgba(28,52,43,.20)&#x27; };
      }
      function paintTile(ctx, type, x, y, cw, ch) {
        const c=colors(); const px=x*cw, py=y*ch;
        const custom=customTileDefs[type];
        if(custom){ctx.fillStyle=custom.color;ctx.fillRect(px,py,cw,ch);if(custom.image&amp;&amp;custom.image.complete)ctx.drawImage(custom.image,px,py,cw,ch);return;}
        if(type===&#x27;grass&#x27;){ctx.fillStyle=(x+y)%2?c.grass:c.grass2;ctx.fillRect(px,py,cw,ch);ctx.fillStyle=&#x27;rgba(255,255,255,.06)&#x27;;ctx.fillRect(px+cw*.18,py+ch*.2,2,2);}
        if(type===&#x27;path&#x27;){ctx.fillStyle=(x+y)%2?c.path:c.path2;ctx.fillRect(px,py,cw,ch);ctx.fillStyle=&#x27;rgba(92,70,40,.16)&#x27;;ctx.fillRect(px+cw*.25,py+ch*.3,2,2);ctx.fillRect(px+cw*.7,py+ch*.7,2,2);}
        if(type===&#x27;water&#x27;){ctx.fillStyle=(x+y)%2?c.water:c.water2;ctx.fillRect(px,py,cw,ch);ctx.strokeStyle=&#x27;rgba(255,255,255,.25)&#x27;;ctx.beginPath();ctx.moveTo(px+cw*.15,py+ch*.55);ctx.lineTo(px+cw*.75,py+ch*.55);ctx.stroke();}
        if(type===&#x27;floor&#x27;){ctx.fillStyle=(x%2)?c.floor:c.floor2;ctx.fillRect(px,py,cw,ch);ctx.strokeStyle=&#x27;rgba(90,55,30,.22)&#x27;;ctx.beginPath();ctx.moveTo(px+cw*.5,py);ctx.lineTo(px+cw*.5,py+ch);ctx.stroke();}
        if(type===&#x27;wall&#x27;){ctx.fillStyle=c.wall;ctx.fillRect(px,py,cw,ch);ctx.fillStyle=c.wall2;ctx.fillRect(px+1,py+1,cw-2,ch*.35);}
        if(type===&#x27;tree&#x27;){ctx.fillStyle=c.grass;ctx.fillRect(px,py,cw,ch);ctx.fillStyle=&#x27;#765038&#x27;;ctx.fillRect(px+cw*.44,py+ch*.48,cw*.14,ch*.42);ctx.fillStyle=c.tree;ctx.beginPath();ctx.arc(px+cw*.5,py+ch*.38,Math.min(cw,ch)*.34,0,Math.PI*2);ctx.fill();}
      }
      function drawBase(canvas, mode) {
        const ctx=canvas.getContext(&#x27;2d&#x27;); const cw=canvas.width/width, ch=canvas.height/height;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(let y=0;y&lt;height;y++) for(let x=0;x&lt;width;x++) paintTile(ctx,tiles[y][x],x,y,cw,ch);
        ctx.strokeStyle=colors().grid;ctx.lineWidth=1;
        for(let x=0;x&lt;=width;x++){ctx.beginPath();ctx.moveTo(x*cw,0);ctx.lineTo(x*cw,canvas.height);ctx.stroke();}
        for(let y=0;y&lt;=height;y++){ctx.beginPath();ctx.moveTo(0,y*ch);ctx.lineTo(canvas.width,y*ch);ctx.stroke();}
        ctx.font=`500 ${Math.max(13,cw*.34)}px system-ui`;ctx.textAlign=&#x27;center&#x27;;ctx.textBaseline=&#x27;middle&#x27;;
        [[&#x27;咖啡馆&#x27;,6,5],[&#x27;图书馆&#x27;,21.5,4.5],[&#x27;居民公寓&#x27;,6.5,14],[&#x27;东侧公园&#x27;,21.5,14]].forEach(([label,x,y])=&gt;{ctx.fillStyle=&#x27;rgba(12,28,23,.68)&#x27;;ctx.fillRect((x-1.5)*cw,(y-.45)*ch,3*cw,.9*ch);ctx.fillStyle=&#x27;#f7fbf9&#x27;;ctx.fillText(label,x*cw,y*ch);});
        if(mode===&#x27;semantic&#x27;) drawSemantics(ctx,cw,ch);
        if(mode===&#x27;spawn&#x27;) drawAgents(ctx,cw,ch);
        if(mode===&#x27;paint&#x27;){ctx.strokeStyle=&#x27;#f7fbf9&#x27;;ctx.lineWidth=3;ctx.strokeRect(selected.x*cw+2,selected.y*ch+2,cw-4,ch-4);ctx.strokeStyle=&#x27;rgba(19,83,72,.9)&#x27;;ctx.lineWidth=1;ctx.strokeRect(selected.x*cw+4,selected.y*ch+4,cw-8,ch-8);}
      }
      function drawSemantics(ctx,cw,ch){
        const styles={sector:[&#x27;rgba(42,139,119,.20)&#x27;,&#x27;#278f7b&#x27;],arena:[&#x27;rgba(226,144,77,.18)&#x27;,&#x27;#e9904d&#x27;],object:[&#x27;rgba(190,70,60,.22)&#x27;,&#x27;#bd514d&#x27;],collision:[&#x27;rgba(190,70,60,.28)&#x27;,&#x27;#bd514d&#x27;]};
        semanticRegions.forEach(r=&gt;{const s=styles[r.type]||styles.sector;ctx.fillStyle=s[0];ctx.strokeStyle=s[1];ctx.lineWidth=3;if(r.type===&#x27;arena&#x27;)ctx.setLineDash([7,5]);ctx.fillRect(r.x*cw,r.y*ch,r.w*cw,r.h*ch);ctx.strokeRect(r.x*cw+2,r.y*ch+2,r.w*cw-4,r.h*ch-4);ctx.setLineDash([]);ctx.fillStyle=&#x27;#f9fffc&#x27;;ctx.fillText(r.label,(r.x+r.w/2)*cw,(r.y+.65)*ch);});
        if(semanticPreview){const r=semanticPreview,s=styles[currentSemantic]||styles.sector;ctx.fillStyle=s[0];ctx.strokeStyle=s[1];ctx.lineWidth=3;ctx.setLineDash([6,4]);ctx.fillRect(r.x*cw,r.y*ch,r.w*cw,r.h*ch);ctx.strokeRect(r.x*cw+2,r.y*ch+2,r.w*cw-4,r.h*ch-4);ctx.setLineDash([]);}
        ctx.fillStyle=&#x27;rgba(190,70,60,.25)&#x27;;for(let y=0;y&lt;height;y++){ctx.fillRect(0,y*ch,2*cw,ch);}
      }
      function drawAgents(ctx,cw,ch){
        agents.forEach((a,i)=&gt;{if(!root.querySelector(&#x27;#af-show-all-agents&#x27;).checked&amp;&amp;i!==selectedAgent)return;ctx.beginPath();ctx.arc((a.x+.5)*cw,(a.y+.5)*ch,Math.min(cw,ch)*.34,0,Math.PI*2);ctx.fillStyle=a.color;ctx.fill();ctx.lineWidth=i===selectedAgent?4:2;ctx.strokeStyle=i===selectedAgent?&#x27;#ffffff&#x27;:&#x27;rgba(255,255,255,.75)&#x27;;ctx.stroke();ctx.fillStyle=&#x27;#fff&#x27;;ctx.font=`500 ${Math.max(11,cw*.28)}px system-ui`;ctx.fillText(a.name[0],(a.x+.5)*cw,(a.y+.5)*ch);});
      }
      function redraw(){ drawBase(primaryCanvas,&#x27;paint&#x27;); if(mirrorCanvases[0])drawBase(mirrorCanvases[0],&#x27;semantic&#x27;); if(mirrorCanvases[1])drawBase(mirrorCanvases[1],&#x27;spawn&#x27;); applyViewport(); }
      function cellFromEvent(canvas,event){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(width-1,Math.floor((event.clientX-r.left)/r.width*width))),y:Math.max(0,Math.min(height-1,Math.floor((event.clientY-r.top)/r.height*height)))};}
      function applyViewport(){root.querySelectorAll(&#x27;canvas&#x27;).forEach(c=&gt;{c.style.transform=`translate(${panX}px, ${panY}px) scale(${zoom/100})`;c.classList.toggle(&#x27;is-pan-tool&#x27;,currentTool===&#x27;pan&#x27;);});root.querySelector(&#x27;#af-zoom-label&#x27;).textContent=`${zoom}%`;}
      function wantsPan(event){return (activeTab===&#x27;paint&#x27;&amp;&amp;currentTool===&#x27;pan&#x27;)||spaceHeld||event.button===1;}
      function beginPan(canvas,event){event.preventDefault();panning=true;panStart={clientX:event.clientX,clientY:event.clientY,x:panX,y:panY};canvas.setPointerCapture(event.pointerId);canvas.closest(&#x27;.af-canvas-wrap&#x27;).classList.add(&#x27;is-panning&#x27;,&#x27;is-dragging&#x27;);}
      function movePan(event){if(!panning||!panStart)return;panX=panStart.x+event.clientX-panStart.clientX;panY=panStart.y+event.clientY-panStart.clientY;applyViewport();}
      function endPan(canvas){panning=false;panStart=null;const wrap=canvas.closest(&#x27;.af-canvas-wrap&#x27;);wrap.classList.remove(&#x27;is-dragging&#x27;);if(!spaceHeld&amp;&amp;currentTool!==&#x27;pan&#x27;)wrap.classList.remove(&#x27;is-panning&#x27;);}
      function changeZoom(delta){zoom=Math.max(50,Math.min(250,zoom+delta));applyViewport();showToast(`画布缩放 ${zoom}%`);}
      function semanticRect(a,b){return{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x)+1,h:Math.abs(a.y-b.y)+1};}
      function selectSemantic(region){if(!region)return;root.querySelector(&#x27;#af-semantic-key&#x27;).textContent=region.id;root.querySelector(&#x27;#af-semantic-name&#x27;).textContent=region.label;root.querySelector(&#x27;#af-semantic-parent&#x27;).textContent=region.type===&#x27;sector&#x27;?&#x27;世界根节点&#x27;:&#x27;自动匹配所在 Sector&#x27;;root.querySelector(&#x27;#af-semantic-size&#x27;).textContent=`${region.w*region.h} tiles`;}
      function createSemantic(rect){const labels={sector:&#x27;新区域&#x27;,arena:&#x27;新场所&#x27;,object:&#x27;新物体&#x27;,collision:&#x27;碰撞区&#x27;};const region={id:`${currentSemantic}-${semanticCounter++}`,type:currentSemantic,...rect,label:`${labels[currentSemantic]} ${semanticCounter-1}`};semanticRegions.push(region);selectSemantic(region);markDirty();showToast(`${region.label}已创建，可在右侧编辑属性`);}
      function snapshot(){return tiles.map(row=&gt;row.slice());}
      function markDirty(){root.querySelector(&#x27;#af-save-state&#x27;).textContent=&#x27;正在自动保存…&#x27;;clearTimeout(saveTimer);saveTimer=setTimeout(()=&gt;{root.querySelector(&#x27;#af-save-state&#x27;).textContent=&#x27;所有更改已保存&#x27;;showToast(editContext===&#x27;public&#x27;?&#x27;公共地图草稿已自动保存&#x27;:&#x27;实验微调层已自动保存&#x27;);},650);}
      function commitBeforeChange(){undoStack.push(snapshot());if(undoStack.length&gt;30)undoStack.shift();redoStack=[];}
      function applyAt(cell, continuous=false){selected=cell;if(currentTool===&#x27;select&#x27;){updateInspector();redraw();return;}if(!continuous)commitBeforeChange();const replacement=currentTool===&#x27;erase&#x27;?&#x27;grass&#x27;:currentTile;if(currentTool===&#x27;fill&#x27;)flood(cell.x,cell.y,tiles[cell.y][cell.x],replacement);else tiles[cell.y][cell.x]=replacement;updateInspector();markDirty();redraw();}
      function flood(x,y,target,replacement){if(target===replacement)return;const q=[[x,y]];while(q.length){const [cx,cy]=q.pop();if(cx&lt;0||cy&lt;0||cx&gt;=width||cy&gt;=height||tiles[cy][cx]!==target)continue;tiles[cy][cx]=replacement;q.push([cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]);}}
      function isPassable(type){return customTileDefs[type]?customTileDefs[type].passable:![&#x27;wall&#x27;,&#x27;water&#x27;,&#x27;tree&#x27;].includes(type);}
      function updateInspector(){const type=tiles[selected.y][selected.x];root.querySelector(&#x27;#af-cell-coord&#x27;).textContent=`${selected.x}, ${selected.y}`;root.querySelector(&#x27;#af-cell-tile&#x27;).textContent=`${tileNames[type]} · ${tileIds[type]}`;root.querySelector(&#x27;#af-cell-address&#x27;).textContent=addressAt(selected.x,selected.y);root.querySelector(&#x27;#af-cell-passable&#x27;).textContent=isPassable(type)?&#x27;可通行&#x27;:&#x27;不可通行&#x27;;root.querySelector(&#x27;#af-cursor-label&#x27;).textContent=`坐标 ${selected.x}, ${selected.y}`;}
