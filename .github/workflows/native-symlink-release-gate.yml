name: Portable release gates

on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-symlink:
    name: native-symlink (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GA_REQUIRE_NATIVE_SYMLINK_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Enable Developer Mode for native Windows symlinks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[runtime,studio,web,dev]"
          python -m pip install tzdata==2025.2
      - name: Require seven real native-symlink assertions with zero skips
        run: python tools/run_symlink_release_gate.py

  installed-release:
    name: installed-release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install runtime, test and wheel dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[runtime,studio,web,dev]"
          python -m pip install tzdata==2025.2 setuptools wheel
      - name: Python regression suite
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Frontend regression suite
        run: node --test tests/frontend/*.test.cjs
      - name: Build wheel from the current checkout
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - name: Verify wheel resources and installed CLI lifecycle
        run: python tools/verify_wheel.py dist/generative_agents_cn-0.1.0-py3-none-any.whl
